  <head>

      name="description"
      content="CivicPulse · Riba-roja de Túria — Quejas ciudadanas con reloj legal LPACAP, 16 fuentes abiertas, Telegram @munigraph_bot → sede electrónica → Síndic de Greuges CV."
    />
    <meta name="theme-color" content="#0E5B62" />

    <!-- Open Graph / Twitter / WhatsApp / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CivicPulse" />
    <meta property="og:title" content="CivicPulse · Riba-roja de Túria" />

    />
    <meta property="og:url" content="https://civicpulse.es/" />
    <!-- PNG, no SVG: Facebook, WhatsApp, X y LinkedIn no renderizan SVG como
         og:image. La tarjeta más vista del proyecto se estaba sirviendo en un
         formato que esas plataformas descartan. public/og.svg sigue siendo la
         fuente; `npm run render:og` la rasteriza. -->
    <meta property="og:image" content="https://civicpulse.es/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="CivicPulse · Riba-roja de Túria — qué hace el ayuntamiento, con una cita por cada afirmación"
    />
    <meta property="og:locale" content="es_ES" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CivicPulse · Riba-roja de Túria" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Tres familias, una por función (§03):
           Outfit    interfaz, titulares y cuerpo
           DM Mono   todo lo auditable, con cifras tabulares
           Fraunces  la voz editorial larga: /reportajes y el modo prensa
         Inter se retira: se cargaba en cuatro pesos y no la usaba NADIE.
         Fraunces se queda, y ahí el brandbook se equivoca sobre este repo — su
         motivo para retirarla («se carga y no se usa») es cierto de Inter y
         falso de ésta. Borrarla aplanaría la pieza larga contra el cuadro de
         mando, que es la distinción que justifica una tercera familia. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=DM+Mono:wght@400;500;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700;9..144,800;9..144,900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Canonical pulse monogram — Brandbook v2 §01. Replaces the Vite-era mark. -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%232463EB'/><path d='M10 34 L20 34 L24 26 L32 44 L38 30 L42 34 L54 34' fill='none' stroke='white' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'/><circle cx='54' cy='34' r='2.6' fill='white'/></svg>"
    />
  </head>

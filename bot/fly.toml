# Fly.io deploy config for the CivicPulse bot.
#
# One-time setup:
#   fly launch --name civicpulse-bot-ribarroja --no-deploy --copy-config
#   fly volumes create botdata --size 1 --region mad
#   fly secrets set \
#     BOT_TOKEN=xxx \
#     CHANNEL_ID=-100xxxx \
#     ADMIN_USER_IDS=123,456 \
#     MODERATOR_NAME="Vecino/a moderador/a" \
#     EXPORT_TOKEN=some-random-string \
#     PUBLIC_BASE_URL=https://civicpulse-virid.vercel.app
#   fly deploy
#
# After first deploy, set GitHub repo vars so the nightly cron can reach
# the bot:
#   gh variable set BOT_EXPORT_URL --body https://civicpulse-bot-ribarroja.fly.dev/export/quejas.json
#   gh secret   set BOT_EXPORT_TOKEN --body <same-EXPORT_TOKEN>

app = "civicpulse-bot-ribarroja"
primary_region = "mad"

[build]
  dockerfile = "Dockerfile"
  # Build from the monorepo root so the Dockerfile can COPY ../src + ../public/data.
  # `fly deploy` from the /bot directory uses --dockerfile=Dockerfile and
  # --build-arg to select this context via our .dockerignore layout.

[env]
  PORT = "3000"
  NODE_ENV = "production"

[mounts]
  source = "botdata"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_start_machines = true
  auto_stop_machines = false
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    protocol = "http"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

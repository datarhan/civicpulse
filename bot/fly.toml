# Fly.io deploy config for the MuniGraph / CivicPulse bot.
#
# Build context: this Dockerfile reads files from the MONOREPO ROOT
# (queja-router + officials.json live in ../src and ../public), so both
# launch + deploy must be run from the project root with explicit paths:
#
#   # One-time app creation (run from repo root):
#   flyctl auth login
#   flyctl launch --config bot/fly.toml --name munigraph-ribarroja \
#                 --copy-config --no-deploy
#
#   # Persistent volume for SQLite:
#   flyctl volumes create botdata --size 1 --region cdg --app munigraph-ribarroja
#
#   # Secrets (paste the values you need; leave out what you don't use yet):
#   flyctl secrets set --app munigraph-ribarroja \
#     BOT_TOKEN=... \
#     EXPORT_TOKEN=$(openssl rand -hex 16) \
#     PUBLIC_BASE_URL=https://civicpulse-virid.vercel.app \
#     WEBHOOK_URL=https://munigraph-ribarroja.fly.dev \
#     MODERATOR_NAME="Tu nombre" \
#     # CHANNEL_ID=-100xxxx   (set later once channel exists)
#     # ADMIN_USER_IDS=123,456 (set later for /batch + /escalar)
#
#   # Deploy — must pass explicit paths so the monorepo root is the build context:
#   flyctl deploy --config bot/fly.toml \
#                 --dockerfile bot/Dockerfile \
#                 --remote-only .
#
# After first deploy, wire the nightly export cron:
#   gh variable set BOT_EXPORT_URL --body https://munigraph-ribarroja.fly.dev/export/quejas.json
#   gh secret   set BOT_EXPORT_TOKEN --body <same value you set for EXPORT_TOKEN>

app = "munigraph-ribarroja"
# Paris. Madrid (`mad`) is no longer offered by Fly — the EU options are ams,
# fra, cdg and lhr. cdg is the closest of those to València, and squarely
# EU/EEA. London is deliberately NOT used: post-Brexit UK sits outside the EEA,
# and quejas carry complaint text plus Telegram user IDs, i.e. personal data of
# residents. Keeping it inside the EEA avoids an adequacy discussion entirely.
primary_region = "cdg"

[build]
  # Resolved relative to THIS file (bot/), not to the working directory —
  # "bot/Dockerfile" here becomes bot/bot/Dockerfile and the deploy fails.
  # The build CONTEXT is separate: pass the repo root as the positional
  # working directory, because the Dockerfile copies ../src and
  # ../public/data:
  #     flyctl deploy . --config bot/fly.toml
  dockerfile = "Dockerfile"
  ignorefile = ".dockerignore"

[env]
  PORT = "3000"
  NODE_ENV = "production"

  # CRITICAL — without this the database lands on ephemeral container disk.
  #
  # `DB_PATH` defaults to './data/bot.db' (src/db/client.ts), and the container
  # WORKDIR is /app/bot, so it would resolve to /app/bot/data/bot.db — NOT the
  # volume mounted at /data below. Every queja, apoyo and event would be lost on
  # the next restart or deploy. docker-compose.yml pins the same value for the
  # same reason.
  DB_PATH = "/data/bot.db"

  # Webhook mode, not long-polling. Both work on an always-on machine, but only
  # the webhook branch mounts /export/quejas.json (src/index.ts) — and that is
  # the endpoint .github/workflows/pull-quejas.yml fetches to publish the
  # snapshot. In long-polling mode only /health is served, so the site would
  # never receive new quejas.
  #
  # Must match the app's real hostname. Change it if you rename the app or put a
  # custom domain in front.
  WEBHOOK_URL = "https://munigraph-ribarroja.fly.dev"

  # Where the public site lives, used to build links inside bot replies.
  PUBLIC_BASE_URL = "https://www.civicpulse.es"

[mounts]
  source = "botdata"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_start_machines = true
  auto_stop_machines = false
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    protocol = "http"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

name: Derecho de réplica — informe periodístico
description: Formaliza la respuesta oficial de una persona o grupo aludido en un informe publicado en /laboratorio/agentes.
title: "[derecho-replica] <report-id> · <from>"
labels: [derecho-replica, periodista]
body:
  - type: markdown
    attributes:
      value: |
        Si una persona o grupo municipal aludido por un informe periodístico de CivicPulse quiere publicar una respuesta oficial, este es el canal. Las respuestas se insertan íntegras y verbatim en `public/data/journalist-reports.json` y aparecen al pie del informe como *"Réplica de …"*.

        Plazo de revisión: 24 h hábiles. Resolución: 72 h. Historial público en git.

  - type: input
    id: report-id
    attributes:
      label: ID del informe
      description: Copia el identificador que aparece junto al título del informe (formato `r-…-YYYY-MM-DD`). Si llegas desde el enlace "Responder como persona o grupo afectado" en la propia página, este campo se precompleta.
      placeholder: r-robert-raga-bio-2026-05-23
    validations:
      required: true

  - type: dropdown
    id: from
    attributes:
      label: Quién responde
      options:
        - PSOE
        - PP
        - VOX
        - Compromís
        - Ciudadanos
        - Otro
        - person
    validations:
      required: true

  - type: input
    id: responder-name
    attributes:
      label: Portavoz o firmante (opcional)
      description: Nombre y cargo de la persona firmante. No se publica; sólo se usa para la verificación interna del origen.
      placeholder: "ej. Alcalde de Riba-roja"

  - type: textarea
    id: quote
    attributes:
      label: Cita literal de la réplica (verbatim, ≥20 caracteres)
      description: |
        Texto que se publicará íntegramente al pie del informe. Puede ser tan breve o tan extenso como consideres necesario (máx. 2.000 caracteres). NO se resume ni parafrasea: se publica exactamente como lo escribas aquí.

        Si la réplica tiene fuentes adicionales (nota de prensa, sentencia, comunicado oficial), usa el campo de abajo.
      placeholder: |
        "Esta corporación municipal aclara que el procedimiento citado se ajusta a la legalidad vigente, según resolución pública del órgano competente con fecha …"
    validations:
      required: true

  - type: input
    id: source-url
    attributes:
      label: URL de la fuente (opcional)
      description: Nota de prensa oficial, sentencia, acta o cualquier documento público que soporte la réplica. El enlace se publica junto al texto para que la ciudadanía pueda contrastar.
      placeholder: https://www.ribarroja.es/…

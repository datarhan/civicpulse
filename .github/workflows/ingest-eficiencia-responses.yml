name: Ingest eficiencia responses

# Derecho de réplica sobre una ficha de /eficiencia: issue → CLI con validador
# delante → commit en el historial público.
#
# Comparte la etiqueta `derecho-replica` con las demás plantillas de réplica,
# así que cada ingesta se enruta por la etiqueta propia de SU plantilla: ésta
# por `eficiencia`, la de hallazgos por `hallazgo`. Enrutar por exclusión hacía
# que una ingesta comentara un error sobre la réplica válida de otra.
#
# Todo dato que venga del issue viaja por `env:` y se lee como variable de
# shell, nunca interpolado en el `run:` — el cuerpo de un issue lo escribe
# cualquiera, y `${{ github.event.issue.body }}` dentro de un `run:` es
# ejecución de comandos con otro nombre.

# Publicar exige APROBACIÓN. La plantilla del issue pone la etiqueta que lo
# enruta; la que publica es `publicar`, que ninguna plantilla pone y que aplica
# un mantenedor después de comprobar que el texto viene de quien dice venir.
# Hasta el 2026-09-25 la etiqueta de la propia plantilla bastaba para comitear en
# main y desplegar, y `edited` volvía a publicar en cada edición: cualquiera con
# cuenta de GitHub podía publicar un texto bajo el nombre de un grupo.
# `tests/ingesta-aprobacion.test.js` lo sostiene.

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to re-process
        required: true

permissions:
  contents: write
  issues: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'publicar' &&
        contains(github.event.issue.labels.*.name, 'derecho-replica') &&
        contains(github.event.issue.labels.*.name, 'eficiencia'))
    steps:
      # Publica sólo quien mantiene el repositorio. La etiqueta `publicar` no la
      # pone ninguna plantilla y aplicarla exige permiso de triaje o más, pero eso
      # es configuración de GitHub y no de este fichero: se comprueba aquí, antes
      # de tocar nada. Si falla, el workflow sale en ROJO —y el bot de Fly avisa
      # de los workflows fallidos—, porque alguien sin permiso intentó publicar.
      - name: Sólo publica un mantenedor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          QUIEN: ${{ github.event.sender.login || github.actor }}
        run: |
          set -euo pipefail
          PERMISO=$(gh api "repos/${REPO}/collaborators/${QUIEN}/permission" --jq .permission 2>/dev/null || echo none)
          case "$PERMISO" in
            admin|maintain|write) echo "✓ ${QUIEN} (${PERMISO}) aprueba la publicación" ;;
            *) echo "::error::${QUIEN} (${PERMISO}) no puede aprobar una publicación"; exit 1 ;;
          esac

      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci --no-audit --no-fund

      - name: Extract fields from issue body
        id: parse
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
        run: |
          set -euo pipefail
          BODY=$(gh issue view "$ISSUE_NUMBER" --json body -q .body)

          field() {
            awk -v h="$1" 'BEGIN{cap=0} $0 == "### " h {cap=1; next} /^### /{cap=0} cap' <<< "$BODY" \
              | sed '/^$/d' | awk '{$1=$1;print}' | head -n 60
          }

          FINDING_ID=$(field 'ID de la ficha' | head -n1)
          RESPONDENTE=$(field 'Quién responde' | head -n1)
          QUOTE=$(field 'Texto literal de la réplica (verbatim, ≥20 caracteres)' | tr '\n' ' ' | sed 's/  */ /g' | awk '{$1=$1;print}')
          SOURCE_URL=$(field 'URL de la fuente (opcional)' | head -n1)

          if [ -z "$FINDING_ID" ] || [ -z "$RESPONDENTE" ] || [ -z "$QUOTE" ]; then
            echo "::error::Missing finding-id / respondente / quote"
            gh issue comment "$ISSUE_NUMBER" --body ":warning: No se pudieron extraer los campos obligatorios (ID de la ficha, quién responde, texto). Revisa la plantilla y vuelve a enviar."
            exit 1
          fi

          echo "finding_id=$FINDING_ID"   >> "$GITHUB_OUTPUT"
          echo "respondente=$RESPONDENTE" >> "$GITHUB_OUTPUT"
          {
            echo "quote<<EOFQUOTE"
            echo "$QUOTE"
            echo "EOFQUOTE"
          } >> "$GITHUB_OUTPUT"
          echo "source_url=$SOURCE_URL"   >> "$GITHUB_OUTPUT"

      - name: Apply via indicador-reply CLI
        env:
          FINDING_ID: ${{ steps.parse.outputs.finding_id }}
          RESPONDENTE: ${{ steps.parse.outputs.respondente }}
          QUOTE: ${{ steps.parse.outputs.quote }}
          SOURCE_URL: ${{ steps.parse.outputs.source_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
        run: |
          set -euo pipefail
          if [ -n "$SOURCE_URL" ]; then
            npm run indicador-reply -- "$FINDING_ID" "$RESPONDENTE" "$QUOTE" "$SOURCE_URL" || {
              gh issue comment "$ISSUE_NUMBER" --body ":x: El validador rechazó la réplica. Comprueba que el texto tenga ≥20 caracteres, que el ID de la ficha sea correcto y que la ficha siga publicada."
              exit 1
            }
          else
            npm run indicador-reply -- "$FINDING_ID" "$RESPONDENTE" "$QUOTE" || {
              gh issue comment "$ISSUE_NUMBER" --body ":x: El validador rechazó la réplica. Comprueba que el texto tenga ≥20 caracteres, que el ID de la ficha sea correcto y que la ficha siga publicada."
              exit 1
            }
          fi

      - name: Commit + push if diff
        run: |
          set -euo pipefail
          if git diff --quiet public/data/eficiencia-findings.json; then
            echo "No diff to commit."
            exit 0
          fi
          git config user.name  "civicpulse-bot"
          git config user.email "bot@civicpulse"
          git add public/data/eficiencia-findings.json
          git commit -m "feat(eficiencia): ingest réplica from #${ISSUE_NUMBER}"
          git push
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}

      - name: Close the issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
          FINDING_ID: ${{ steps.parse.outputs.finding_id }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body ":white_check_mark: Réplica publicada en la ficha \`${FINDING_ID}\`. Visible en https://www.civicpulse.es/eficiencia#hallazgos"
          gh issue close "$ISSUE_NUMBER" --reason completed

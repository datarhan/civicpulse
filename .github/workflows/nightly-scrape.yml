name: Nightly real-data refresh

on:
  schedule:
    # 04:30 UTC every day (06:30 Spanish summer, 05:30 winter) — before morning
    - cron: '30 4 * * *'
  workflow_dispatch:
    inputs:
      adapters:
        description: 'Adapter set (all | officials | budget | tenders | padron | participa | press | geo | bdns | paro | plenos | pleno-agendas | empleo | wikidata | ctbg | consell-cv | promise-suggestions)'
        default: 'all'

concurrency:
  group: scrape
  cancel-in-progress: false # guard against overlapping runs

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Este tope es la SUMA de los topes de los pasos, no una estimación de lo
    # que tarda la nocturna (23,4 min medidos el 8-09-2026). Ningún paso puede
    # pasarse del suyo, así que el trabajo no puede pasarse de la suma: el tope
    # de aquí es el respaldo, y sólo tiene que ser lo bastante alto para no
    # dispararse ANTES que el del paso que se atascó.
    #
    # Estaba en 30 con 28 ya declarados entre «Verifier corpus» (6) y
    # «Run scraper(s)» (22), dejando DOS minutos para `npm ci`, Playwright,
    # 5.909 pruebas, el commit, el push, el resumen y la puerta. La cuenta sólo
    # salía mientras el raspado no gastara su presupuesto; el día que lo gastó,
    # el trabajo se pasó, y un JOB timeout no concluye `failure` sino
    # `cancelled` — que es la conclusión que se salta el commit y tira la noche
    # entera. Costó 3 noches en julio (07-11 → 07-13) y la del 7-09-2026.
    #
    # `tests/nightly-budget.test.js` fija la cuenta para que no se vuelva a
    # torcer en silencio. Los minutos no se facturan: el repositorio es público
    # desde el 8-09-2026, así que un tope holgado no cuesta nada y un tope corto
    # cuesta un día de portada.
    timeout-minutes: 85
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Full history: the Commit step rebases onto origin/main when a
          # local push races this run, and rebasing inside the default
          # depth-1 shallow clone is unreliable. ~105 MB / 900 commits —
          # a few seconds against a ~10-minute scrape.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install deps
        # 0,1 min con caché; el tope cubre el fallo de caché, no el caso bueno.
        timeout-minutes: 6
        run: npm ci

      # El corpus del verificador, ANTES del scrape y con su propio reloj.
      #
      # `pleno-claims-verified-base.json` está gitignorado y es reproducible
      # (determinista, sin LLM, sin red). Sin él fallan tres ficheros de prueba y
      # el nodo `finding-quote-provenance.json` de `refresh` — que es lo que dejó
      # la nocturna roja del 08-11 al 08-13, con el despliegue bloqueado.
      #
      # Vivía dentro de `scrape-all.sh`, y el 2026-08-13 el primer intento murió
      # así: los adaptadores se comieron los 22 min del paso y el reloj cayó a
      # los 44 segundos de empezar la regeneración. No es un scraper, es un
      # PRERREQUISITO de los tests y de refresh; compitiendo por el presupuesto
      # del scrape, una noche lenta de red lo mata. Con paso propio no puede
      # quedarse sin tiempo, y si falla se ve dónde.
      - name: Verifier corpus (deterministic, reproducible)
        timeout-minutes: 6
        run: |
          if [ ! -f public/data/pleno-claims-verified-base.json ]; then
            npm run verify:pleno-claims -- --base-only
          else
            echo "corpus ya presente — nada que reproducir"
          fi

      - name: Run scraper(s)
        id: scrape
        # Time-box the scrape BELOW the job timeout: exceeding this fails
        # only this step (rc stays unset → health gate reds the run), while
        # the always() Commit step still pushes every adapter that
        # finished before the axe fell.
        #
        # Recalibrado el 22-09-2026 sobre la ejecución 35710338380, la cuarta
        # de nueve noches que agotó los 22 min de entonces: 21,3 min sólo de
        # adaptadores —civic-poi 6,3 con Overpass devolviendo 504 (el 12-09:
        # 5 s); pleno-agendas 6,1 en archivo porque regmeet bloquea al runner;
        # paro 2,7 FUNCIONANDO (el 12-09 fallaba en 6 s); el resto 6,3— más
        # 1,7 de cola medidos el 20-09. Lo que cambió no fue el tope sino las
        # escaleras que se lo comían sin techo: Overpass lleva ahora un
        # presupuesto de 5 min POR PROCESO (era 180 s × 3 intentos × 3
        # espejos = 27 min por consulta, y geo hace tres) y la fase de
        # archivo de pleno-agendas 2,5 min (era sin tope: 26 sesiones × hasta
        # 90 s). Cuenta con topes: 6,3 sanos + 1,7 de cola + paro 5 (su
        # cortacircuitos) + agendas 4 + un Overpass degradado 5 = 22; treinta
        # deja sitio a que se degraden TRES adaptadores de Overpass a la vez,
        # no los cuatro (38). Que quepa en el trabajo lo suma
        # `tests/nightly-budget.test.js`.
        #
        # Desde el 01-11-2026 este tope ya no es quien corta a un adaptador
        # atascado: `scrape-all.sh` reparte el reloj por dentro (tope por
        # adaptador y presupuesto común) para que la cola y el `npm test` lleguen
        # siempre, y dice qué no llegó a intentar. Éste queda de respaldo.
        #
        # La salida va también a una bitácora porque el hacha no avisa: cae sin
        # que el guion pueda decir nada, y las tres noches de octubre el nombre
        # del adaptador quedaba 800 líneas por encima del error. La puerta de
        # salud la lee para decir en qué etapa cayó y qué críticos fallaron.
        timeout-minutes: 30
        # ADAPTERS passed via env (not inline ${{ }}) so a workflow_dispatch
        # input can never break out of the case "..." quoting into the shell.
        env:
          ADAPTERS: ${{ inputs.adapters || 'all' }}
        run: |
          # Deliberately NOT 'set -e': a scraper failure must not abort this
          # step. We capture it in `rc`, let the Commit step push whatever DID
          # refresh, and red the run later in the health gate. That is what
          # stops one flaky/dead upstream from freezing the whole site.
          set -uo pipefail
          rc=0
          case "$ADAPTERS" in
            all)
              # `pipefail` (arriba) es lo que hace que `rc` sea el de scrape:all y
              # no el de `tee`, que siempre sale 0.
              npm run scrape:all 2>&1 | tee "$RUNNER_TEMP/scrape-all.log" || rc=$?
              # NOTE: the press fact-check laboratory chain (extract →
              # verify → summarize → analytics → auto-curate-press →
              # audit-press-links + scrape:factcheck) used to run HERE, but
              # GitHub-hosted CI has no LLM backend and no
              # GOOGLE_FACT_CHECK_API_KEY, so every stage silently wrote an
              # empty snapshot (extract → items:[] → exit 0 → green ✅) and
              # then COMMITTED those empties — clobbering any real claims the
              # local pipeline produced. It has been migrated to a local cron
              # (scripts/press-lab-pipeline.sh · installed via
              # scripts/cron-install-press-lab.sh), mirroring the /hallazgos
              # pipeline, where `agy` (Google-subscription CLI, $0) + the .env
              # keys actually exist. The nightly still scrapes press.json above
              # (scrape:all → scrape:press, no LLM needed); the local cron
              # git-pulls that and owns the derived press-* snapshots.
              ;;
            officials)             npm run scrape:officials || rc=$? ;;
            budget)                npm run scrape:budget || rc=$? ;;
            tenders)               npm run scrape:tenders || rc=$? ;;
            padron)                npm run scrape:padron || rc=$? ;;
            participa)             npm run scrape:participa || rc=$? ;;
            press)                 npm run scrape:press || rc=$? ;;
            geo)                   npm run scrape:geo || rc=$? ;;
            bdns)                  npm run scrape:bdns || rc=$? ;;
            paro)                  npm run scrape:paro || rc=$? ;;
            plenos)                npm run scrape:plenos || rc=$? ;;
            pleno-agendas)         npm run scrape:pleno-agendas || rc=$? ;;
            empleo)                npm run scrape:empleo || rc=$? ;;
            wikidata)              npm run scrape:wikidata || rc=$? ;;
            ctbg)                  npm run scrape:ctbg || rc=$? ;;
            consell-cv)            npm run scrape:consell-cv || rc=$? ;;
            promise-suggestions)   npm run scrape:promise-suggestions || rc=$? ;;
            *) echo "unknown adapter set"; exit 1 ;;
          esac
          # Surface the critical-failure code to later steps. rc is 0 whenever
          # only best-effort adapters (metro-network / participa) failed —
          # scrape-all.sh excludes those from its exit code on purpose.
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -ne 0 ]; then
            echo "::warning::A critical scraper failed (rc=$rc). The adapters that DID refresh are still committed; the health gate will red this run after the commit."
          fi

      # `npm test` incluye UN test que levanta chromium de verdad:
      # tests/reader-review-resiliencia.test.ts apunta el lector real a un
      # puerto muerto para comprobar que reintenta y nombra lo que no leyó.
      # Sin navegador no falla por lo que vigila, falla con «browserType.launch:
      # Executable doesn't exist» — y como `npm test` es lo que la puerta de
      # salud mira, la nocturna llevaba en rojo desde que ese test nació el
      # 2026-08-14, bloqueando el despliegue cada noche sin que el motivo se
      # pareciera en nada a su causa.
      #
      # e2e.yml es el único sitio que instalaba navegador, y NO corre vitest, así
      # que este test no se ejecutaba de verdad en ninguna parte de CI: rojo por
      # no poder ejecutarse, que es el reverso del verde por no ejecutarse que
      # este repositorio persigue. Mismo par cacheado que e2e.yml, sin inventar
      # una variante.
      #
      # `!cancelled()` en estos tres pasos y en `Run tests`: un paso sin estado
      # explícito lleva un `success()` implícito, y se salta en cuanto algo falla
      # antes. El 26-10-2026 un `apt` lento y del 29 al 31-10 el hacha del raspado
      # dejaron cuatro noches sin pruebas, y una prueba rota por datos pasó tres
      # días sin aviso hasta que la enseñó una PR ajena. Una noche cortada es la
      # que más necesita saber si `main` sigue sano, porque sus datos se comitean
      # igual. No `always()`: un trabajo cancelado por su tope tiene que llegar al
      # commit, no gastarse lo que le queda en las pruebas.
      - name: Cache Playwright browsers
        id: cache-pw
        if: ${{ !cancelled() }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Los dos siguientes se excluyen entre sí —uno corre con caché y el otro
      # sin ella—, pero el presupuesto los suma a los dos. Sobrestimar sólo
      # pide un tope de trabajo más alto, que aquí es gratis.
      - name: Install Playwright Chromium
        if: ${{ !cancelled() && steps.cache-pw.outputs.cache-hit != 'true' }}
        timeout-minutes: 8
        run: |
          # apt sale en error EN BLOQUE por una sola fuente rota, y la del
          # runner que sobra tumbó CI cuatro veces el 2026-09-09. Va aquí
          # dentro y no en un paso hermano para que no pueda separarse de la
          # instalación que protege ni perder su `if:`.
          bash scripts/ci-apt-fuentes-rotas.sh
          npx playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit)
        if: ${{ !cancelled() && steps.cache-pw.outputs.cache-hit == 'true' }}
        timeout-minutes: 3
        run: |
          # apt sale en error EN BLOQUE por una sola fuente rota, y la del
          # runner que sobra tumbó CI cuatro veces el 2026-09-09. Va aquí
          # dentro y no en un paso hermano para que no pueda separarse de la
          # instalación que protege ni perder su `if:`.
          bash scripts/ci-apt-fuentes-rotas.sh
          npx playwright install-deps chromium

      # Tests validate the parser CODE against fixtures, but not only: some read
      # the data this run has just left on disk, which is how a nightly can break
      # one. continue-on-error so a failure here can't skip the commit of fresh
      # data — it is folded into the health gate instead.
      - name: Run tests
        id: tests
        if: ${{ !cancelled() }}
        continue-on-error: true
        # 3,8 min medidos el 8-09-2026 sobre 5.909 pruebas. Corría SIN tope, que
        # es lo que hacía imposible cuadrar el presupuesto del trabajo: un paso
        # que no declara lo suyo no se puede sumar.
        timeout-minutes: 15
        env:
          SCRAPE_RC: ${{ steps.scrape.outputs.rc }}
        run: |
          # Sin rc, el hacha cayó antes del `refresh` del final de scrape-all.sh:
          # las pruebas verían los derivados rancios y `data-graph-frescura`
          # rojearía por el corte, tapando lo que de verdad esté roto. El commit
          # rederiva después de todos modos; esto sólo adelanta lo que va a pasar.
          if [ -z "${SCRAPE_RC:-}" ]; then
            npm run refresh || echo "::warning::refresh falló tras el corte — las pruebas corren igual y data-graph-frescura dirá qué quedó sin reconstruir"
          fi
          npm test

      # Corre pase lo que pase, CANCELACIÓN INCLUIDA, y ésa es la diferencia
      # que costó una noche. Comitea lo que los adaptadores hayan refrescado,
      # así que un fallo crítico no congela el sitio: los datos sanos aterrizan
      # igual y se despliegan en la siguiente nocturna verde (el `workflow_run`
      # del deploy exige `success`).
      #
      # Llevaba `!cancelled()`, que suena a lo mismo y no lo es: un trabajo que
      # agota su `timeout-minutes` concluye `cancelled`, no `failure`, así que
      # justo la noche en que el raspado tarda de más —la noche en la que los
      # datos frescos más caros salieron— este paso se saltaba y se perdía todo
      # lo raspado. Con `always()` el tope del trabajo deja de ser una pérdida
      # de datos y pasa a ser sólo una ejecución roja, que es lo que debe ser.
      #
      # Sí, con `always()` una cancelación MANUAL también comitea. Es lo
      # correcto: este paso ya comiteaba raspados parciales a propósito en los
      # runs en rojo, y un snapshot parcial es idempotente —lo reescribe la
      # siguiente pasada—. Perder la noche no se arregla en la siguiente pasada.
      - name: Commit refreshed JSON
        id: commit
        if: ${{ always() }}
        timeout-minutes: 5
        env:
          ADAPTERS: ${{ inputs.adapters || 'all' }}
          EVENT_NAME: ${{ github.event_name }}
          SCRAPE_RC: ${{ steps.scrape.outputs.rc }}
        run: |
          set -uo pipefail
          git config user.name  "civicpulse-bot"
          git config user.email "bot@civicpulse"

          # ── Rederivar ANTES de estacar ─────────────────────────────────────
          #
          # `scrape-all.sh` ya llama a `npm run refresh` al final, y ése es el
          # sitio correcto para una ejecución que TERMINA. El 14-09-2026 no
          # terminó: «Run scraper(s)» agotó sus 22 minutos (ejecución
          # 34831225509) 107 segundos después de que el raspado reescribiera
          # `plenos-agendas.json` entero, así que el hacha cayó antes del bloque
          # de derivaciones —en todo el registro no aparece ni un
          # «[scrape-all] running: refresh»— y este paso, que corre con
          # `always()` a propósito, empujó a main los snapshots nuevos con los
          # nodos derivados sin reconstruir. Seis fallos en
          # `tests/data-graph-frescura.test.ts`, la puerta de salud en rojo y el
          # despliegue saltado: el sitio sirvió los datos del día anterior.
          #
          # Éste es el único paso que sobrevive al hacha, así que aquí se
          # rederiva. Barato e idempotente: sólo reconstruye lo que sus entradas
          # hayan movido —2,6 s medidos con los cinco nodos rancios de ese día—,
          # y por eso NO hace falta tocar el tope de 5 min, que además no habría
          # de dónde subir: el presupuesto de la nocturna deja 3 min de holgura.
          #
          # Tolerante a propósito. Un derivado que no se pueda reconstruir no
          # puede costar la noche entera de datos, que es el daño que `always()`
          # existe para evitar; y si algo queda sin reconstruir, la guarda de
          # frescura lo dice a gritos en el paso siguiente.
          npm run refresh || echo "::warning::refresh falló dentro del paso del commit — los datos se comitean igual; tests/data-graph-frescura.test.ts rojeará esta ejecución si algún nodo derivado quedó sin reconstruir"

          git add public/data
          if git diff --cached --quiet; then
            echo "No upstream changes today."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            TODAY=$(date -u +%Y-%m-%d)
            git commit \
              -m "chore(data): nightly real-data refresh ($TODAY)" \
              -m "Pipelines: $ADAPTERS" \
              -m "Triggered: $EVENT_NAME" \
              -m "Scrape rc: ${SCRAPE_RC:-step-timeout} (partial refresh commits the adapters that succeeded)"

            # A bare `git push` loses the ENTIRE night's data whenever main
            # moves during the ~10-min run: the push is rejected
            # non-fast-forward and the commit dies with the runner. That is
            # not hypothetical — 2026-07-31 lost a clean refresh (oficial=50)
            # because a local `data(journalist)` commit landed at 07:26Z,
            # between this job's 07:19Z checkout and its 07:29Z push. Local
            # cron pipelines (hallazgos Mon+Thu 09:30, press-lab Mon 10:15
            # Madrid) push into exactly this window, so rebase and retry.
            #
            # Rebase is safe here: this job only ever stages scraper-owned
            # files under public/data, and the curated snapshots the local
            # crons touch (journalist-reports, pleno-findings, promises…)
            # are never written by scrapers, so those two sets don't overlap.
            #
            # Lo que SÍ puede chocar es una PR que regenera la salida de un
            # raspador con la nocturna en marcha, que es lo normal al cablear un
            # adaptador: el 29-10-2026 #493 fusionó `budget-execution.json` a
            # mitad del raspado y esa noche no se comiteó nada. El mensaje decía
            # entonces que había chocado un fichero curado, y no era cierto: aquí
            # se aborta sin forzar nada y se nombra lo que chocó.
            pushed=false
            for attempt in 1 2 3 4 5; do
              if git push origin HEAD; then
                pushed=true
                break
              fi
              echo "::warning::push attempt $attempt rejected — rebasing onto origin/${GITHUB_REF_NAME} and retrying"
              git fetch origin "$GITHUB_REF_NAME"
              if ! git rebase "origin/${GITHUB_REF_NAME}"; then
                chocan=$(git diff --name-only --diff-filter=U | tr '\n' ' ')
                git rebase --abort || true
                echo "::error::Conflicto al rebasar sobre origin/${GITHUB_REF_NAME} en: ${chocan:-sin nombre}— otro commit tocó lo mismo con la nocturna en marcha. No se fuerza nada: los datos de esta noche NO se comitearon, y la siguiente pasada los rehace."
                echo "changed=false" >> "$GITHUB_OUTPUT"
                exit 1
              fi
              sleep $((attempt * 5))
            done

            if [ "$pushed" != true ]; then
              echo "::error::Could not push refreshed data after 5 attempts — main is moving faster than the retry window."
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Summary
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        env:
          ADAPTERS: ${{ inputs.adapters || 'all' }}
          CHANGED: ${{ steps.commit.outputs.changed }}
          SCRAPE_RC: ${{ steps.scrape.outputs.rc }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          echo "### Nightly scrape summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Pipelines: \`$ADAPTERS\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Changed: \`${CHANGED:-false}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Critical scrape rc: \`${SCRAPE_RC:-step-timeout}\` (0 = all critical adapters ok; best-effort metro-network/participa never set this; step-timeout = scrape step killed at its timeout-minutes)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tests: \`${TESTS_OUTCOME:-skipped}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          # generatedAt per file: a frozen adapter is invisible in file
          # sizes (yesterday's JSON has yesterday's size) but jumps out
          # as a stale timestamp here.
          echo "Public JSON files:" >> "$GITHUB_STEP_SUMMARY"
          for f in public/data/*.json; do
            GEN=$(node -e "try{const j=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'));process.stdout.write(j.generatedAt||'—')}catch{process.stdout.write('?')}" "$f")
            echo "  - $f ($(du -h "$f" | cut -f1)) · generatedAt: $GEN" >> "$GITHUB_STEP_SUMMARY"
          done

      # Final gate — runs AFTER the commit so fresh data is already pushed.
      # Reds the run (blocking the Vercel deploy) only on a CRITICAL scraper
      # failure or a test failure. Best-effort metro-network/participa never
      # reach here (scrape-all.sh keeps rc=0 for them) — so their flaking
      # still produces a green run that deploys.
      - name: Health gate
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        env:
          SCRAPE_OUTCOME: ${{ steps.scrape.outcome }}
          SCRAPE_RC: ${{ steps.scrape.outputs.rc }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          fail=0
          bitacora="$RUNNER_TEMP/scrape-all.log"
          # Sin rc hay dos historias, y no son la misma: el paso se saltó porque
          # algo falló antes, o el hacha lo cortó a medias. Ninguna es un verde,
          # aunque los adaptadores que terminaron ya estén comiteados arriba.
          if [ -z "${SCRAPE_RC:-}" ]; then
            if [ "${SCRAPE_OUTCOME:-}" = "skipped" ]; then
              echo "::error::El raspado no llegó a correr: falló un paso anterior. Ningún adaptador refrescó esta noche."
            else
              etapa=$(sed -n 's/.*\[scrape-all\] running: //p' "$bitacora" 2>/dev/null | tail -1)
              donde="dentro de «$etapa»"
              [ -n "$etapa" ] || donde="y no se sabe en qué etapa"
              echo "::error::El raspado se cortó antes de dar su rc, $donde. Lo terminado se comiteó; esta ejecución en rojo no despliega."
            fi
            fail=1
          elif [ "$SCRAPE_RC" -ne 0 ]; then
            criticos=$(sed -n '/critical failure(s):/,$ s/^  - //p' "$bitacora" 2>/dev/null | tr '\n' ' ')
            echo "::error::Fallaron adaptadores CRÍTICOS (rc=${SCRAPE_RC}): ${criticos:-mira el registro}— lo sano se comiteó; esta ejecución en rojo no despliega."
            fail=1
          fi
          # `!= success` y no `= failure`: unas pruebas que no corrieron no son
          # unas pruebas que pasaron.
          if [ "${TESTS_OUTCOME:-}" != "success" ]; then
            echo "::error::npm test no pasó (${TESTS_OUTCOME:-sin resultado}) — esta ejecución no despliega."
            fail=1
          fi
          if [ "$fail" -eq 0 ]; then
            echo "Críticos y pruebas en verde. Lo blando que fallara no bloquea: míralo en el parte de scrape-all."
          fi
          exit "$fail"

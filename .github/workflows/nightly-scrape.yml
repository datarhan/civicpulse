name: Nightly real-data refresh

on:
  schedule:
    # 04:30 UTC every day (06:30 Spanish summer, 05:30 winter) — before morning
    - cron: '30 4 * * *'
  workflow_dispatch:
    inputs:
      adapters:
        description: 'Adapter set (all | officials | budget | tenders | padron | participa | press | geo | bdns | paro | plenos | pleno-agendas | empleo | wikidata | ctbg | consell-cv | spain-ticker | promise-suggestions)'
        default: 'all'

concurrency:
  group: scrape
  cancel-in-progress: false # guard against overlapping runs

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Job budget must stay ABOVE the scrape step's own timeout-minutes: a
    # JOB timeout cancels the whole run and `if: !cancelled()` then skips
    # the Commit step — that exact failure lost 3 straight nights of fresh
    # data (2026-07-11 → 07-13) when SEPE/regmeet started blackholing
    # GitHub-runner IPs and slow-failing fetch retries pushed the scrape
    # past 20 min. The scrape step is time-boxed below instead; a step
    # timeout only fails the STEP, and the commit still runs.
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Full history: the Commit step rebases onto origin/main when a
          # local push races this run, and rebasing inside the default
          # depth-1 shallow clone is unreliable. ~105 MB / 900 commits —
          # a few seconds against a ~10-minute scrape.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      # El corpus del verificador, ANTES del scrape y con su propio reloj.
      #
      # `pleno-claims-verified-base.json` está gitignorado y es reproducible
      # (determinista, sin LLM, sin red). Sin él fallan tres ficheros de prueba y
      # el nodo `finding-quote-provenance.json` de `refresh` — que es lo que dejó
      # la nocturna roja del 08-11 al 08-13, con el despliegue bloqueado.
      #
      # Vivía dentro de `scrape-all.sh`, y el 2026-08-13 el primer intento murió
      # así: los adaptadores se comieron los 22 min del paso y el reloj cayó a
      # los 44 segundos de empezar la regeneración. No es un scraper, es un
      # PRERREQUISITO de los tests y de refresh; compitiendo por el presupuesto
      # del scrape, una noche lenta de red lo mata. Con paso propio no puede
      # quedarse sin tiempo, y si falla se ve dónde.
      - name: Verifier corpus (deterministic, reproducible)
        timeout-minutes: 6
        run: |
          if [ ! -f public/data/pleno-claims-verified-base.json ]; then
            npm run verify:pleno-claims -- --base-only
          else
            echo "corpus ya presente — nada que reproducir"
          fi

      - name: Run scraper(s)
        id: scrape
        # Time-box the scrape BELOW the job timeout: exceeding this fails
        # only this step (rc stays unset → health gate reds the run), while
        # the !cancelled() Commit step still pushes every adapter that
        # finished before the axe fell. Budget calibrated on the 2026-07-13
        # dispatched run: ~4 min healthy suite + up to ~8 min of Overpass
        # mirror rotation on geo + ~4 min of paro/pleno-agendas circuit
        # breakers when SEPE/regmeet blackhole runner IPs + ~5 min tail.
        # 22 + npm ci + tests + commit still fits the 30-min job.
        timeout-minutes: 22
        # ADAPTERS passed via env (not inline ${{ }}) so a workflow_dispatch
        # input can never break out of the case "..." quoting into the shell.
        env:
          ADAPTERS: ${{ inputs.adapters || 'all' }}
        run: |
          # Deliberately NOT 'set -e': a scraper failure must not abort this
          # step. We capture it in `rc`, let the Commit step push whatever DID
          # refresh, and red the run later in the health gate. That is what
          # stops one flaky/dead upstream from freezing the whole site.
          set -uo pipefail
          rc=0
          case "$ADAPTERS" in
            all)
              npm run scrape:all || rc=$?
              # NOTE: the press fact-check laboratory chain (extract →
              # verify → summarize → analytics → auto-curate-press →
              # audit-press-links + scrape:factcheck) used to run HERE, but
              # GitHub-hosted CI has no LLM backend and no
              # GOOGLE_FACT_CHECK_API_KEY, so every stage silently wrote an
              # empty snapshot (extract → items:[] → exit 0 → green ✅) and
              # then COMMITTED those empties — clobbering any real claims the
              # local pipeline produced. It has been migrated to a local cron
              # (scripts/press-lab-pipeline.sh · installed via
              # scripts/cron-install-press-lab.sh), mirroring the /hallazgos
              # pipeline, where `agy` (Google-subscription CLI, $0) + the .env
              # keys actually exist. The nightly still scrapes press.json above
              # (scrape:all → scrape:press, no LLM needed); the local cron
              # git-pulls that and owns the derived press-* snapshots.
              ;;
            officials)             npm run scrape:officials || rc=$? ;;
            budget)                npm run scrape:budget || rc=$? ;;
            tenders)               npm run scrape:tenders || rc=$? ;;
            padron)                npm run scrape:padron || rc=$? ;;
            participa)             npm run scrape:participa || rc=$? ;;
            press)                 npm run scrape:press || rc=$? ;;
            geo)                   npm run scrape:geo || rc=$? ;;
            bdns)                  npm run scrape:bdns || rc=$? ;;
            paro)                  npm run scrape:paro || rc=$? ;;
            plenos)                npm run scrape:plenos || rc=$? ;;
            pleno-agendas)         npm run scrape:pleno-agendas || rc=$? ;;
            empleo)                npm run scrape:empleo || rc=$? ;;
            wikidata)              npm run scrape:wikidata || rc=$? ;;
            ctbg)                  npm run scrape:ctbg || rc=$? ;;
            consell-cv)            npm run scrape:consell-cv || rc=$? ;;
            spain-ticker)          npm run scrape:spain-ticker || rc=$? ;;
            promise-suggestions)   npm run scrape:promise-suggestions || rc=$? ;;
            *) echo "unknown adapter set"; exit 1 ;;
          esac
          # Surface the critical-failure code to later steps. rc is 0 whenever
          # only best-effort adapters (metro-network / participa) failed —
          # scrape-all.sh excludes those from its exit code on purpose.
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -ne 0 ]; then
            echo "::warning::A critical scraper failed (rc=$rc). The adapters that DID refresh are still committed; the health gate will red this run after the commit."
          fi

      # Tests validate the parser CODE against fixtures (independent of today's
      # live data). continue-on-error so a failure here can't skip the commit
      # of fresh data — it is folded into the health gate instead.
      - name: Run tests
        id: tests
        continue-on-error: true
        run: npm test

      # Runs even when a scraper failed (!cancelled). Commits + pushes whatever
      # adapters refreshed, so a critical failure no longer freezes the whole
      # site — the healthy data still lands. On a red run it stays in git and
      # ships on the next green nightly (the workflow_run deploy needs success).
      - name: Commit refreshed JSON
        id: commit
        if: ${{ !cancelled() }}
        env:
          ADAPTERS: ${{ inputs.adapters || 'all' }}
          EVENT_NAME: ${{ github.event_name }}
          SCRAPE_RC: ${{ steps.scrape.outputs.rc }}
        run: |
          set -uo pipefail
          git config user.name  "civicpulse-bot"
          git config user.email "bot@civicpulse"
          git add public/data
          if git diff --cached --quiet; then
            echo "No upstream changes today."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            TODAY=$(date -u +%Y-%m-%d)
            git commit \
              -m "chore(data): nightly real-data refresh ($TODAY)" \
              -m "Pipelines: $ADAPTERS" \
              -m "Triggered: $EVENT_NAME" \
              -m "Scrape rc: ${SCRAPE_RC:-step-timeout} (partial refresh commits the adapters that succeeded)"

            # A bare `git push` loses the ENTIRE night's data whenever main
            # moves during the ~10-min run: the push is rejected
            # non-fast-forward and the commit dies with the runner. That is
            # not hypothetical — 2026-07-31 lost a clean refresh (oficial=50)
            # because a local `data(journalist)` commit landed at 07:26Z,
            # between this job's 07:19Z checkout and its 07:29Z push. Local
            # cron pipelines (hallazgos 09:30, press-lab 10:15 Madrid) push
            # into exactly this window every day, so rebase and retry.
            #
            # Rebase is safe here: this job only ever stages scraper-owned
            # files under public/data, and the curated snapshots the local
            # crons touch (journalist-reports, pleno-findings, promises…)
            # are never written by scrapers, so the two sets don't overlap.
            # A genuine conflict therefore means an assumption broke — abort
            # and fail loudly rather than clobber curated editorial work.
            pushed=false
            for attempt in 1 2 3 4 5; do
              if git push origin HEAD; then
                pushed=true
                break
              fi
              echo "::warning::push attempt $attempt rejected — rebasing onto origin/${GITHUB_REF_NAME} and retrying"
              git fetch origin "$GITHUB_REF_NAME"
              if ! git rebase "origin/${GITHUB_REF_NAME}"; then
                git rebase --abort || true
                echo "::error::Rebase conflict against origin/${GITHUB_REF_NAME} — a curated file collided with a scraper output. Refusing to force-push over editorial work; this night's data was NOT committed."
                echo "changed=false" >> "$GITHUB_OUTPUT"
                exit 1
              fi
              sleep $((attempt * 5))
            done

            if [ "$pushed" != true ]; then
              echo "::error::Could not push refreshed data after 5 attempts — main is moving faster than the retry window."
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Summary
        if: ${{ !cancelled() }}
        env:
          ADAPTERS: ${{ inputs.adapters || 'all' }}
          CHANGED: ${{ steps.commit.outputs.changed }}
          SCRAPE_RC: ${{ steps.scrape.outputs.rc }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          echo "### Nightly scrape summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Pipelines: \`$ADAPTERS\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Changed: \`${CHANGED:-false}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Critical scrape rc: \`${SCRAPE_RC:-step-timeout}\` (0 = all critical adapters ok; best-effort metro-network/participa never set this; step-timeout = scrape step killed at 22 min)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tests: \`${TESTS_OUTCOME:-skipped}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          # generatedAt per file: a frozen adapter is invisible in file
          # sizes (yesterday's JSON has yesterday's size) but jumps out
          # as a stale timestamp here.
          echo "Public JSON files:" >> "$GITHUB_STEP_SUMMARY"
          for f in public/data/*.json; do
            GEN=$(node -e "try{const j=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'));process.stdout.write(j.generatedAt||'—')}catch{process.stdout.write('?')}" "$f")
            echo "  - $f ($(du -h "$f" | cut -f1)) · generatedAt: $GEN" >> "$GITHUB_STEP_SUMMARY"
          done

      # Final gate — runs AFTER the commit so fresh data is already pushed.
      # Reds the run (blocking the Vercel deploy) only on a CRITICAL scraper
      # failure or a test failure. Best-effort metro-network/participa never
      # reach here (scrape-all.sh keeps rc=0 for them) — so their flaking
      # still produces a green run that deploys.
      - name: Health gate
        if: ${{ !cancelled() }}
        env:
          SCRAPE_RC: ${{ steps.scrape.outputs.rc }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          fail=0
          # An UNSET rc means the scrape step was killed by its
          # timeout-minutes before it could report — treat that as a
          # critical failure, never as green (the fresh data from the
          # adapters that finished was still committed above).
          if [ -z "${SCRAPE_RC:-}" ]; then
            echo "::error::Scrape step hit its 22-min timeout before reporting rc. Adapters that finished were committed; this red run blocks the deploy until the slow/hung source is fixed."
            fail=1
          elif [ "$SCRAPE_RC" -ne 0 ]; then
            echo "::error::One or more CRITICAL scrapers failed (rc=${SCRAPE_RC}). Fresh data from the healthy adapters was committed; this red run intentionally blocks the deploy until the critical source is fixed."
            fail=1
          fi
          if [ "${TESTS_OUTCOME}" = "failure" ]; then
            echo "::error::npm test failed on main — blocking deploy."
            fail=1
          fi
          if [ "$fail" -eq 0 ]; then
            echo "All critical adapters + tests green (best-effort metro-network/participa failures, if any, are non-blocking)."
          fi
          exit "$fail"

name: Nightly real-data refresh

on:
  schedule:
    # 04:30 UTC every day (06:30 Spanish summer, 05:30 winter) — before morning
    - cron: '30 4 * * *'
  workflow_dispatch:
    inputs:
      adapters:
        description: 'Adapter set (all | officials | budget | tenders | padron | participa | press | geo | bdns | paro | plenos | pleno-agendas | wikidata | ctbg | consell-cv | spain-ticker | promise-suggestions)'
        default: 'all'

concurrency:
  group: scrape
  cancel-in-progress: false  # guard against overlapping runs

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Run scraper(s)
        run: |
          set -euo pipefail
          case "${{ inputs.adapters || 'all' }}" in
            all)
              npm run scrape:all
              # Press fact-check laboratory chain (Phase 1-8 of the
              # /laboratorio plan). Each step is RESILIENT (a transient
              # LLM-API outage or missing key must not kill the whole
              # nightly) but never SILENT: run_lab records each exit
              # code into the step summary, so a failing stage can't
              # hide behind a green tick — the pattern that froze
              # press.json for 8 days. auto-curate-press has its own
              # LOREG hard-stop built in.
              # scrape:factcheck runs FIRST so verify:press-claims can
              # cross-reference Newtral / Maldita / EFE Verifica.
              # Gracefully no-ops when GOOGLE_FACT_CHECK_API_KEY is absent.
              LAB_RESULTS=""
              run_lab() {
                local label="$1"; shift
                if "$@"; then
                  LAB_RESULTS="${LAB_RESULTS}- ✅ ${label}\n"
                else
                  LAB_RESULTS="${LAB_RESULTS}- ❌ ${label} (exit $?)\n"
                fi
              }
              run_lab "scrape:factcheck"        npm run scrape:factcheck
              run_lab "extract:press-claims"    npm run extract:press-claims -- --max 60
              run_lab "verify:press-claims"     npm run verify:press-claims
              run_lab "summarize:press"         npm run summarize:press -- --max 40
              run_lab "compute:press-analytics" npm run compute:press-analytics
              run_lab "auto-curate-press"       npm run auto-curate-press
              # Daily link-rot audit + Wayback availability lookup.
              # Surfaces dead source URLs on /laboratorio so curators
              # can cite the frozen snapshot instead of the 404. Runs
              # LAST so it sees every claim the night's extract added.
              run_lab "audit-press-links"       npm run audit-press-links
              {
                echo "### Press-lab chain"
                printf '%b' "$LAB_RESULTS"
                echo ""
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            officials)             npm run scrape:officials ;;
            budget)                npm run scrape:budget ;;
            tenders)               npm run scrape:tenders ;;
            padron)                npm run scrape:padron ;;
            participa)             npm run scrape:participa ;;
            press)                 npm run scrape:press ;;
            geo)                   npm run scrape:geo ;;
            bdns)                  npm run scrape:bdns ;;
            paro)                  npm run scrape:paro ;;
            plenos)                npm run scrape:plenos ;;
            pleno-agendas)         npm run scrape:pleno-agendas ;;
            wikidata)              npm run scrape:wikidata ;;
            ctbg)                  npm run scrape:ctbg ;;
            consell-cv)            npm run scrape:consell-cv ;;
            spain-ticker)          npm run scrape:spain-ticker ;;
            promise-suggestions)   npm run scrape:promise-suggestions ;;
            *) echo "unknown adapter set"; exit 1 ;;
          esac

      - name: Run tests
        run: npm test

      - name: Commit refreshed JSON
        id: commit
        run: |
          set -euo pipefail
          git config user.name  "civicpulse-bot"
          git config user.email "bot@civicpulse"
          git add public/data
          if git diff --cached --quiet; then
            echo "No upstream changes today."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            TODAY=$(date -u +%Y-%m-%d)
            git commit \
              -m "chore(data): nightly real-data refresh ($TODAY)" \
              -m "Pipelines: ${{ inputs.adapters || 'all' }}" \
              -m "Triggered: ${{ github.event_name }}"
            git push origin HEAD
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Summary
        run: |
          echo "### Nightly scrape summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Pipelines: \`${{ inputs.adapters || 'all' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Changed: \`${{ steps.commit.outputs.changed }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          # generatedAt per file: a frozen adapter is invisible in file
          # sizes (yesterday's JSON has yesterday's size) but jumps out
          # as a stale timestamp here.
          echo "Public JSON files:" >> "$GITHUB_STEP_SUMMARY"
          for f in public/data/*.json; do
            GEN=$(node -e "try{const j=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'));process.stdout.write(j.generatedAt||'—')}catch{process.stdout.write('?')}" "$f")
            echo "  - $f ($(du -h "$f" | cut -f1)) · generatedAt: $GEN" >> "$GITHUB_STEP_SUMMARY"
          done

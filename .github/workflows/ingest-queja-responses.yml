name: Ingest queja responses

on:
  issues:
    types: [labeled, edited]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to re-process
        required: true

permissions:
  contents: write
  issues: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    # Only run when the issue carries the `queja-response` label
    # (set by the issue template).
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'queja-response') ||
      (github.event.action == 'edited' && contains(github.event.issue.labels.*.name, 'queja-response'))
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci --no-audit --no-fund

      - name: Extract fields from issue body
        id: parse
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
        run: |
          set -euo pipefail
          BODY=$(gh issue view "$ISSUE_NUMBER" --json body -q .body)
          # The issue template uses these exact headings in the markdown body.
          QID=$(awk '/^### ID de la queja$/{getline; getline; print; exit}' <<< "$BODY" | tr -d '\r\n' | xargs)
          ROLE=$(awk '/^### Rol del firmante$/{getline; getline; print; exit}' <<< "$BODY" | tr -d '\r\n' | xargs)
          FIRMANTE=$(awk '/^### Nombre del firmante$/{getline; getline; print; exit}' <<< "$BODY" | tr -d '\r\n' | xargs)
          TEXT=$(awk 'BEGIN{cap=0} /^### Texto de la respuesta \(verbatim\)$/{cap=1; next} /^### /{cap=0} cap' <<< "$BODY" | sed '/^$/d' | sed 's/^```$//g')
          URL=$(awk '/^### URL de fuente primaria \(opcional\)$/{getline; getline; print; exit}' <<< "$BODY" | tr -d '\r\n' | xargs)

          if [ -z "$QID" ] || [ -z "$ROLE" ] || [ -z "$FIRMANTE" ] || [ -z "$TEXT" ]; then
            echo "::error::Missing required fields in issue body (Q-ID / role / firmante / text)."
            gh issue comment "$ISSUE_NUMBER" --body ":warning: No se pudieron extraer todos los campos obligatorios. Revisa la plantilla y vuelve a enviar."
            exit 1
          fi
          # Passes via env-ified stdout so shell quoting is safe.
          printf '%s\0' "$QID" "$ROLE" "$FIRMANTE" "$TEXT" "$URL" > /tmp/fields
          echo "qid=$QID" >> "$GITHUB_OUTPUT"
          echo "firmante=$FIRMANTE" >> "$GITHUB_OUTPUT"

      - name: Apply via curator CLI
        id: apply
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
        run: |
          set -euo pipefail
          # Read the nul-separated fields.
          IFS=$'\0' read -rd '' QID ROLE FIRMANTE TEXT URL < /tmp/fields || true
          ARGS=("$QID" "$ROLE" "$FIRMANTE" "$TEXT")
          if [ -n "$URL" ]; then ARGS+=("$URL"); fi
          if ! npm run queja-reply -- "${ARGS[@]}"; then
            gh issue comment "$ISSUE_NUMBER" --body ":x: CLI validación fallida. Revisa el formato (Q-ID válido, texto 20–2000 caracteres, URL https://…)."
            exit 1
          fi

      - name: Commit + push if diff
        run: |
          set -euo pipefail
          if git diff --quiet public/data/quejas-responses.json; then
            echo "No diff to commit."
            exit 0
          fi
          git config user.name  "civicpulse-bot"
          git config user.email "bot@civicpulse"
          git add public/data/quejas-responses.json
          git commit -m "feat(queja-response): ingest from #${{ github.event.issue.number || inputs.issue_number }}"
          git push

      - name: Close the issue with a pointer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
          QID: ${{ steps.parse.outputs.qid }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body ":white_check_mark: Respuesta incorporada a \`public/data/quejas-responses.json\`. Visible en https://civicpulse-virid.vercel.app/quejas/${QID,,}"
          gh issue close "$ISSUE_NUMBER" --reason completed

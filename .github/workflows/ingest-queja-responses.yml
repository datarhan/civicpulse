name: Ingest queja responses

# Publicar exige APROBACIÓN. La plantilla del issue pone la etiqueta que lo
# enruta; la que publica es `publicar`, que ninguna plantilla pone y que aplica
# un mantenedor después de comprobar que el texto viene de quien dice venir.
# Hasta el 2026-09-25 la etiqueta de la propia plantilla bastaba para comitear en
# main y desplegar, y `edited` volvía a publicar en cada edición: cualquiera con
# cuenta de GitHub podía publicar un texto bajo el nombre de un grupo.
# `tests/ingesta-aprobacion.test.js` lo sostiene.

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to re-process
        required: true

permissions:
  contents: write
  issues: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    # Only run when the issue carries the `queja-response` label
    # (set by the issue template).
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'publicar' &&
        contains(github.event.issue.labels.*.name, 'queja-response'))
    steps:
      # Publica sólo quien mantiene el repositorio. La etiqueta `publicar` no la
      # pone ninguna plantilla y aplicarla exige permiso de triaje o más, pero eso
      # es configuración de GitHub y no de este fichero: se comprueba aquí, antes
      # de tocar nada. Si falla, el workflow sale en ROJO —y el bot de Fly avisa
      # de los workflows fallidos—, porque alguien sin permiso intentó publicar.
      - name: Sólo publica un mantenedor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          QUIEN: ${{ github.event.sender.login || github.actor }}
        run: |
          set -euo pipefail
          PERMISO=$(gh api "repos/${REPO}/collaborators/${QUIEN}/permission" --jq .permission 2>/dev/null || echo none)
          case "$PERMISO" in
            admin|maintain|write) echo "✓ ${QUIEN} (${PERMISO}) aprueba la publicación" ;;
            *) echo "::error::${QUIEN} (${PERMISO}) no puede aprobar una publicación"; exit 1 ;;
          esac

      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci --no-audit --no-fund

      - name: Extract fields from issue body
        id: parse
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
        run: |
          set -euo pipefail
          BODY=$(gh issue view "$ISSUE_NUMBER" --json body -q .body)
          # The issue template uses these exact headings in the markdown body.
          QID=$(awk '/^### ID de la queja$/{getline; getline; print; exit}' <<< "$BODY" | tr -d '\r\n' | xargs)
          ROLE=$(awk '/^### Rol del firmante$/{getline; getline; print; exit}' <<< "$BODY" | tr -d '\r\n' | xargs)
          FIRMANTE=$(awk '/^### Nombre del firmante$/{getline; getline; print; exit}' <<< "$BODY" | tr -d '\r\n' | xargs)
          TEXT=$(awk 'BEGIN{cap=0} /^### Texto de la respuesta \(verbatim\)$/{cap=1; next} /^### /{cap=0} cap' <<< "$BODY" | sed '/^$/d' | sed 's/^```$//g')
          URL=$(awk '/^### URL de fuente primaria \(opcional\)$/{getline; getline; print; exit}' <<< "$BODY" | tr -d '\r\n' | xargs)

          if [ -z "$QID" ] || [ -z "$ROLE" ] || [ -z "$FIRMANTE" ] || [ -z "$TEXT" ]; then
            echo "::error::Missing required fields in issue body (Q-ID / role / firmante / text)."
            gh issue comment "$ISSUE_NUMBER" --body ":warning: No se pudieron extraer todos los campos obligatorios. Revisa la plantilla y vuelve a enviar."
            exit 1
          fi
          # Passes via env-ified stdout so shell quoting is safe.
          printf '%s\0' "$QID" "$ROLE" "$FIRMANTE" "$TEXT" "$URL" > /tmp/fields
          echo "qid=$QID" >> "$GITHUB_OUTPUT"
          echo "firmante=$FIRMANTE" >> "$GITHUB_OUTPUT"

      - name: Apply via curator CLI
        id: apply
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
        run: |
          set -euo pipefail
          # Read the nul-separated fields.
          IFS=$'\0' read -rd '' QID ROLE FIRMANTE TEXT URL < /tmp/fields || true
          ARGS=("$QID" "$ROLE" "$FIRMANTE" "$TEXT")
          if [ -n "$URL" ]; then ARGS+=("$URL"); fi
          if ! npm run queja-reply -- "${ARGS[@]}"; then
            gh issue comment "$ISSUE_NUMBER" --body ":x: CLI validación fallida. Revisa el formato (Q-ID válido, texto 20–2000 caracteres, URL https://…)."
            exit 1
          fi

      - name: Commit + push if diff
        run: |
          set -euo pipefail
          if git diff --quiet public/data/quejas-responses.json; then
            echo "No diff to commit."
            exit 0
          fi
          git config user.name  "civicpulse-bot"
          git config user.email "bot@civicpulse"
          git add public/data/quejas-responses.json
          git commit -m "feat(queja-response): ingest from #${{ github.event.issue.number || inputs.issue_number }}"
          git push

      - name: Close the issue with a pointer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
          QID: ${{ steps.parse.outputs.qid }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body ":white_check_mark: Respuesta incorporada a \`public/data/quejas-responses.json\`. Visible en https://www.civicpulse.es/quejas/${QID,,}"
          gh issue close "$ISSUE_NUMBER" --reason completed

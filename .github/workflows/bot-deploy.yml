name: Bot deploy

# Comitear no es desplegar, y esa distancia ya ha costado dos veces.
#
# El 8-09-2026 el bot se quedó MUDO al rotar el token porque Fly no se
# actualizó. El 9-09-2026 se añadió al calendario de convocatorias un premio que
# cerraba en 36 días, se comprobó que el aviso salía bien, y la máquina de Fly
# seguía sirviendo la versión de las 08:16Z — anterior a los cuatro commits del
# día. El aviso del 15 de septiembre no iba a salir, y NADA lo decía: `bot.yml`
# corría las pruebas y estaba verde, `main` tenía el código y estaba verde, y el
# bot en producción era de otra hora. Tres verdes y un bot viejo.
#
# Hasta hoy esa distancia la cubría una persona acordándose de correr `flyctl
# deploy` a mano. Acordarse no es un mecanismo.
#
# POR QUÉ SÓLO EN `main` Y CON `bot/**`. El bot es un servicio con estado —una
# base SQLite en un volumen persistente— así que desplegar desde una rama sería
# apuntar un experimento a los datos de producción. Y por ruta, porque un
# despliegue que corriera con cualquier cambio del sitio reiniciaría el bot
# varias veces al día sin motivo.
#
# `concurrency` pone los despliegues EN FILA: dos `flyctl deploy` a la vez sobre
# la misma app se pisan. Hasta el 2026-09-27 cancelaba el que estaba en curso,
# y eso tampoco sirve: Fly puede seguir por su lado con el cancelado, la máquina
# vuelve a arrancar unos minutos después con el siguiente —y lo primero que
# corre al arrancar es una migración de la base de datos—, y la comprobación del
# cancelado no llega a decir nada. Así, cada uno termina y se comprueba.

on:
  push:
    branches: [main]
    paths:
      - 'bot/**'
      - '.github/workflows/bot-deploy.yml'
      # Lo que la imagen lee FUERA de bot/: el Dockerfile copia `src` y
      # `public/data`, y el bot los lee al arrancar. `promises.json` lleva el
      # `frozenUntil` de la LOREG: sin esta ruta, `npm run freeze:set` no llegaba
      # al bot hasta que alguien tocara bot/, y seguiría difundiendo en campaña.
      # `tests/bot-despliegue.test.js` deriva esta lista de bot/src.
      - 'public/data/promises.json'
      - 'public/data/officials.json'
      - 'public/data/geo.json'
      - 'src/scraper/queja-router.ts'
      - 'src/scraper/situar-barrio.ts'
  workflow_dispatch:

concurrency:
  group: bot-deploy
  cancel-in-progress: false

# Este workflow no escribe nada en el repositorio: clona, construye en Fly y
# despliega. Lo único que necesita es leer. El `GITHUB_TOKEN` por defecto viene
# con mucho más, y aquí conviven con él las credenciales de producción del bot.
permissions:
  contents: read

jobs:
  # Lo primero, los tipos y las pruebas del bot: el mismo `bot.yml` que corre en
  # cada PR, llamado desde aquí. Antes los dos se disparaban con el mismo push y
  # corrían en paralelo, así que un arranque que no compilaba o una prueba en
  # rojo llegaban a Fly igual. Lo siguiente que se despliega es una migración de
  # la base de datos, y la única copia de los datos está en ese volumen.
  pruebas:
    uses: ./.github/workflows/bot.yml

  deploy:
    name: Deploy bot to Fly
    needs: pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # Sólo main, y lo comprueba un PASO que falla, no un `if:` que se saltaría en
      # verde. `workflow_dispatch` acepta cualquier rama, y el bot tiene una base
      # de datos de producción: lanzarlo desde una rama desplegaría código sin
      # fusionar sobre ella.
      - name: Sólo desde main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Este workflow despliega en producción y se lanzó desde $GITHUB_REF, no desde refs/heads/main."
            echo "Fusiona a main: el push despliega solo."
            exit 1
          fi

      # Un despliegue que no puede autenticarse tiene que DECIRLO.
      #
      # Sin esto, `flyctl deploy` sin token falla de una forma que es fácil
      # confundir con un problema de red, o —peor— un `if:` sobre el secreto lo
      # saltaría en silencio y el workflow saldría verde sin haber desplegado
      # nada. Eso es exactamente el defecto que este fichero existe para cerrar:
      # una pasada tiene que probar que hizo el trabajo, y «no hice nada» no lo
      # prueba. Se falla, y se dice cómo arreglarlo.
      - name: Comprobar que hay credencial
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::Falta el secreto FLY_API_TOKEN, así que el bot NO se ha desplegado."
            echo "Créalo con:"
            echo "  flyctl tokens create deploy -a munigraph-ribarroja"
            echo "y guárdalo en GitHub con:"
            echo "  gh secret set FLY_API_TOKEN"
            echo "Mientras tanto el bot sigue sirviendo la versión anterior."
            exit 1
          fi

      # Fijada al COMMIT, no a `master`.
      #
      # Es una acción de terceros y corre en el mismo trabajo que
      # `FLY_API_TOKEN`, así que quien pudiera mover esa rama desplegaría lo que
      # quisiera en nuestra app. `master` es una referencia móvil: hoy apunta
      # aquí y mañana a otro sitio, sin que ningún commit nuestro cambie. Este
      # SHA es exactamente lo que `master` servía el 2026-09-09, y coincide con
      # la etiqueta 1.6.
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6

      # `--remote-only` construye en los constructores de Fly: el runner no
      # tiene que montar Docker y el contexto no viaja desde aquí.
      #
      # `--env GIT_SHA=…` le dice a la máquina qué commit lleva, y `/health` lo
      # cuenta como `version` (bot/src/services/health.ts, `VARIABLE_VERSION`).
      - name: Desplegar
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          COMMIT: ${{ github.sha }}
        run: flyctl deploy --config bot/fly.toml --dockerfile bot/Dockerfile --remote-only --env GIT_SHA="$COMMIT"

      # «flyctl deploy» en verde dice que el despliegue terminó, no qué commit
      # sirve la máquina: el 9-09-2026 la de producción era de las 08:16Z con
      # cuatro commits encima, y todo estaba en verde. Aquí se pregunta a la
      # máquina y se compara `version` con el commit fusionado, y además que el
      # webhook de Telegram quedó registrado con su secreto (sin él, cada update
      # real es un 401 y el bot está «arriba pero mudo»). Si en tres minutos no lo
      # dice, el workflow sale en ROJO. Ese rojo lo avisa el propio bot por
      # Telegram (eventos-repo.ts) si sigue vivo; si lo que tumbó el bot fue este
      # despliegue, quedan el correo de GitHub y la alarma diaria (ops-alarm.yml).
      #
      # La dirección sale de `WEBHOOK_URL` en bot/fly.toml, la misma que usa el
      # bot: una copia aquí se quedaría atrás el día que cambie.
      - name: Comprobar que Fly sirve este commit
        env:
          ESPERADA: ${{ github.sha }}
        run: |
          base=$(sed -n 's/^[[:space:]]*WEBHOOK_URL[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' bot/fly.toml | head -n 1)
          if [ -z "$base" ]; then
            echo "::error::No encuentro WEBHOOK_URL en bot/fly.toml: no sé a qué máquina preguntar."
            exit 1
          fi
          salud="${base%/}/health"
          cuerpo=''
          codigo=''
          final=$((SECONDS + 180))
          while [ "$SECONDS" -lt "$final" ]; do
            respuesta=$(curl -sS --max-time 10 -w '\n%{http_code}' "$salud" || true)
            codigo=$(printf '%s' "$respuesta" | tail -n 1)
            leido=$(printf '%s' "$respuesta" | sed '$d')
            if [ -n "$leido" ]; then cuerpo="$leido"; fi
            version=$(printf '%s' "$leido" | jq -r '.version // ""' 2>/dev/null || true)
            autenticado=$(printf '%s' "$leido" | jq -r '.webhookAuthenticated // false' 2>/dev/null || true)
            if [ "$codigo" = "200" ] && [ "$version" = "$ESPERADA" ] && [ "$autenticado" = "true" ]; then
              echo "Fly sirve $ESPERADA y el webhook de Telegram está autenticado ($salud)."
              estado=$(printf '%s' "$leido" | jq -r '.status // ""' 2>/dev/null || true)
              if [ "$estado" != "ok" ]; then
                echo "::warning::/health dice «$estado»: $(printf '%s' "$leido" | jq -c '.degraded' 2>/dev/null || true)"
              fi
              exit 0
            fi
            sleep 5
          done
          echo "::error::En tres minutos, $salud no dice que corra $ESPERADA con el webhook autenticado."
          echo "Último código HTTP: ${codigo:-ninguno}"
          echo "Último cuerpo con contenido: ${cuerpo:-ninguno}"
          exit 1

      # Y que se note que ocurrió: la fecha del despliegue es lo primero que se
      # mira cuando el bot no dice lo que debería.
      - name: Decir qué quedó desplegado
        if: ${{ always() }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl status --config bot/fly.toml || true

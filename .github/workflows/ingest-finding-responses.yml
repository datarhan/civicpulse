name: Ingest finding responses

# Publicar exige APROBACIÓN. La plantilla del issue pone la etiqueta que lo
# enruta; la que publica es `publicar`, que ninguna plantilla pone y que aplica
# un mantenedor después de comprobar que el texto viene de quien dice venir.
# Hasta el 2026-09-25 la etiqueta de la propia plantilla bastaba para comitear en
# main y desplegar, y `edited` volvía a publicar en cada edición: cualquiera con
# cuenta de GitHub podía publicar un texto bajo el nombre de un grupo.
# `tests/ingesta-aprobacion.test.js` lo sostiene.

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to re-process
        required: true

permissions:
  contents: write
  issues: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    # Se enruta por la etiqueta que pone SU plantilla (`hallazgo`), no por
    # exclusión. Excluir sólo `eficiencia` dejaba que esta ingesta disparara
    # también sobre las réplicas de promesas, competencias y periodista —todas
    # llevan `derecho-replica`— y comentara «no se pudieron extraer los campos
    # obligatorios» sobre una réplica válida, que para quien la escribió es
    # indistinguible de un rechazo.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'publicar' &&
        contains(github.event.issue.labels.*.name, 'derecho-replica') &&
        contains(github.event.issue.labels.*.name, 'hallazgo'))
    steps:
      # Publica sólo quien mantiene el repositorio. La etiqueta `publicar` no la
      # pone ninguna plantilla y aplicarla exige permiso de triaje o más, pero eso
      # es configuración de GitHub y no de este fichero: se comprueba aquí, antes
      # de tocar nada. Si falla, el workflow sale en ROJO —y el bot de Fly avisa
      # de los workflows fallidos—, porque alguien sin permiso intentó publicar.
      - name: Sólo publica un mantenedor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          QUIEN: ${{ github.event.sender.login || github.actor }}
        run: |
          set -euo pipefail
          PERMISO=$(gh api "repos/${REPO}/collaborators/${QUIEN}/permission" --jq .permission 2>/dev/null || echo none)
          case "$PERMISO" in
            admin|maintain|write) echo "✓ ${QUIEN} (${PERMISO}) aprueba la publicación" ;;
            *) echo "::error::${QUIEN} (${PERMISO}) no puede aprobar una publicación"; exit 1 ;;
          esac

      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci --no-audit --no-fund

      - name: Extract fields from issue body
        id: parse
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
        run: |
          set -euo pipefail
          BODY=$(gh issue view "$ISSUE_NUMBER" --json body -q .body)

          field() {
            awk -v h="$1" 'BEGIN{cap=0} $0 == "### " h {cap=1; next} /^### /{cap=0} cap' <<< "$BODY" \
              | sed '/^$/d' | awk '{$1=$1;print}' | head -n 40
          }

          FINDING_ID=$(field 'ID del hallazgo' | head -n1)
          PARTY=$(field 'Grupo que responde' | head -n1)
          QUOTE=$(field 'Cita literal de la réplica (verbatim, ≥20 caracteres)' | tr '\n' ' ' | sed 's/  */ /g' | awk '{$1=$1;print}')
          SOURCE_URL=$(field 'URL de la fuente (opcional)' | head -n1)

          # Label-only (finding endpoint)
          if [ -z "$FINDING_ID" ] || [ -z "$PARTY" ] || [ -z "$QUOTE" ]; then
            echo "::error::Missing finding-id / party / quote fields"
            gh issue comment "$ISSUE_NUMBER" --body ":warning: No se pudieron extraer los campos obligatorios (ID, partido, cita). Revisa la plantilla y vuelve a enviar."
            exit 1
          fi

          echo "finding_id=$FINDING_ID"    >> "$GITHUB_OUTPUT"
          echo "party=$PARTY"              >> "$GITHUB_OUTPUT"
          # Multi-line quote via delimiter trick
          {
            echo "quote<<EOFQUOTE"
            echo "$QUOTE"
            echo "EOFQUOTE"
          } >> "$GITHUB_OUTPUT"
          echo "source_url=$SOURCE_URL"    >> "$GITHUB_OUTPUT"

      - name: Apply via finding-reply CLI
        env:
          FINDING_ID: ${{ steps.parse.outputs.finding_id }}
          PARTY: ${{ steps.parse.outputs.party }}
          QUOTE: ${{ steps.parse.outputs.quote }}
          SOURCE_URL: ${{ steps.parse.outputs.source_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
        run: |
          set -euo pipefail
          if [ -n "$SOURCE_URL" ]; then
            npm run finding-reply -- "$FINDING_ID" "$PARTY" "$QUOTE" "$SOURCE_URL" || {
              gh issue comment "$ISSUE_NUMBER" --body ":x: El validador rechazó la réplica. Comprueba que la cita tenga ≥20 caracteres y el ID del hallazgo sea correcto."
              exit 1
            }
          else
            npm run finding-reply -- "$FINDING_ID" "$PARTY" "$QUOTE" || {
              gh issue comment "$ISSUE_NUMBER" --body ":x: El validador rechazó la réplica. Comprueba que la cita tenga ≥20 caracteres y el ID del hallazgo sea correcto."
              exit 1
            }
          fi

      - name: Commit + push if diff
        run: |
          set -euo pipefail
          if git diff --quiet public/data/pleno-findings.json; then
            echo "No diff to commit."
            exit 0
          fi
          git config user.name  "civicpulse-bot"
          git config user.email "bot@civicpulse"
          # Este fichero es ENTRADA de un nodo derivado: publicarlo solo deja ese
          # derivado rancio en `main` hasta la nocturna, y la CI de cualquier PR
          # que construya entretanto sale roja por ello (medido el 16-09-2026).
          # `--rebuilt-paths` imprime sólo lo que la pasada reconstruyó, así que
          # el pathspec no se ensancha más de lo que esta escritura obliga. Se
          # filtra a rutas que EXISTEN: una palabra que no es ruta en un pathspec
          # apaga la red de seguridad del commit entera.
          REDERIVADOS="$(npm run --silent refresh -- --rebuilt-paths 2>/dev/null | while IFS= read -r p; do [ -e "$p" ] && printf '%s ' "$p"; done)" || REDERIVADOS=""
          git add public/data/pleno-findings.json
          if [ -n "$REDERIVADOS" ]; then git add -- $REDERIVADOS; fi
          git commit -m "feat(findings): ingest réplica from #${{ github.event.issue.number || inputs.issue_number }}"
          git push

      - name: Close the issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
          FINDING_ID: ${{ steps.parse.outputs.finding_id }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body ":white_check_mark: Réplica publicada en el hallazgo \`${FINDING_ID}\`. Visible en https://www.civicpulse.es/hallazgos#${FINDING_ID}"
          gh issue close "$ISSUE_NUMBER" --reason completed

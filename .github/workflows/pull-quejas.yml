name: Pull quejas.json from bot

on:
  schedule:
    - cron: '0 4 * * *' # daily 04:00 UTC (before the scrape cron at 04:30)
  workflow_dispatch:

permissions:
  contents: write

# El bot lo lanza al confirmar cada /olvidar (bot/src/services/republicar.ts). Dos
# ejecuciones a la vez traerían la misma instantánea y la segunda fallaría al
# empujar; en cola, la de detrás trae la instantánea más nueva. Sin cancelar la que
# está en marcha, que podría estar a mitad del commit.
concurrency:
  group: pull-quejas
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      # Antes esto era un `if:` a nivel de trabajo — «skip if the bot host isn't
      # configured yet (feature-flagged rollout)»—, y aquella razón caducó: el
      # bot lleva desplegado en Fly desde hace meses. Lo que quedaba era la
      # forma peligrosa: si alguien borra la variable, el trabajo se SALTA, el
      # workflow sale **verde** y las quejas dejan de actualizarse sin que nada
      # lo diga. Este fichero comitea datos publicados; el silencio ahí no es
      # una molestia, es un dato viejo presentado como actual.
      #
      # Es el mismo defecto que tenía `batch-reminder.yml`, que sí llevaba
      # meses sin avisar de nada en verde (2026-09-10).
      - name: Comprobar la configuración
        env:
          EXPORT_URL: ${{ vars.BOT_EXPORT_URL }}
        run: |
          if [ -z "$EXPORT_URL" ]; then
            echo "::error::Falta vars.BOT_EXPORT_URL — sin ella no se puede traer quejas.json."
            echo '### ⛔ Sin `vars.BOT_EXPORT_URL`' >> "$GITHUB_STEP_SUMMARY"
            echo 'Se define con `gh variable set BOT_EXPORT_URL --body "<url del export del bot>"`.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "[pull-quejas] configuración completa"

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      # Hacen falta las dependencias para `npm run refresh` (tsx) del paso de
      # commit: sin ellas este workflow publica la entrada y deja el derivado
      # rancio, que es justo lo que arregla.
      - run: npm ci --no-audit --no-fund

      - name: Pull snapshot
        env:
          EXPORT_URL: ${{ vars.BOT_EXPORT_URL }}
          EXPORT_TOKEN: ${{ secrets.BOT_EXPORT_TOKEN }}
        run: |
          mkdir -p public/data
          if [ -n "$EXPORT_TOKEN" ]; then
            curl -fsS -H "Authorization: Bearer $EXPORT_TOKEN" "$EXPORT_URL" \
              -o public/data/quejas.json
          else
            curl -fsS "$EXPORT_URL" -o public/data/quejas.json
          fi
          # Validate AND re-format. The endpoint serves minified JSON; the
          # local export used to pretty-print. Committing one enormous line
          # would make every future diff unreadable — and for this project the
          # git history IS the audit trail for citizen complaints, so a diff you
          # cannot read is a real loss. Two spaces, matching every other
          # snapshot in public/data.
          node -e "
            const fs = require('fs');
            const p = 'public/data/quejas.json';
            const d = JSON.parse(fs.readFileSync(p, 'utf8'));
            fs.writeFileSync(p, JSON.stringify(d, null, 2) + '\n');
          "
          echo "Pulled $(jq '.stats.total' public/data/quejas.json) quejas"

      # Las fotos viven AQUÍ, donde está la instantánea que manda el bot de producción.
      # La poda del derecho al olvido la hacía antes `npm run process-photos` contra la
      # base de datos que tuviera a mano —en el portátil, una copia de agosto—, así que
      # una queja retirada con /olvidar en Fly no podaba nunca su foto; ahora la foto se
      # va en el mismo commit que la queja. Y las fotos nuevas las anonimiza el bot cada
      # hora en su volumen: este paso trae las que la instantánea enlaza y aún no están,
      # con el mismo token que quejas.json.
      - name: Traer y podar las fotos de quejas
        env:
          EXPORT_URL: ${{ vars.BOT_EXPORT_URL }}
          EXPORT_TOKEN: ${{ secrets.BOT_EXPORT_TOKEN }}
        run: node scripts/fotos-quejas.mjs

      - name: Commit diff (only if changed)
        run: |
          git config user.name 'civicpulse-bot'
          git config user.email 'bot@civicpulse.local'
          # `git status` y no `git diff`: una foto recién traída es un fichero nuevo, y
          # `git diff` no ve lo que todavía no está en el índice.
          if [ -z "$(git status --porcelain -- public/data/quejas.json public/data/quejas-photos)" ]; then
            echo "no changes"
            exit 0
          fi
          # quejas.json es ENTRADA de un nodo derivado, así que publicarla sola
          # deja `queja-contract-relations.json` rancio en `main` hasta la
          # nocturna: medido el 16-09-2026 (commit bc812d8e, tres nodos rancios).
          # `--rebuilt-paths` imprime sólo lo que la pasada reconstruyó, y se
          # filtra a rutas que EXISTEN: lo que salga por stdout acaba en un
          # pathspec, y una palabra que no es una ruta apaga la red de seguridad
          # del commit entera.
          REDERIVADOS="$(npm run --silent refresh -- --rebuilt-paths 2>/dev/null | while IFS= read -r p; do [ -e "$p" ] && printf '%s ' "$p"; done)" || REDERIVADOS=""
          git add -- public/data/quejas.json
          if [ -n "$REDERIVADOS" ]; then git add -- $REDERIVADOS; fi
          # La carpeta de fotos puede no existir: si un día se podan todas, git no
          # guarda carpetas vacías, y `git add` con una ruta que no casa con nada
          # falla en seco (medido).
          if [ -d public/data/quejas-photos ]; then git add -A -- public/data/quejas-photos; fi
          git commit -m "chore(quejas): daily snapshot from bot"
          git push

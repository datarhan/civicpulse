name: e2e

on:
  push:
    branches: [main]
    paths-ignore:
      - 'public/data/**'
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'public/data/**'
      - '**/*.md'
  workflow_dispatch:

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Lint (fails on errors only; warnings allowed)
        run: npm run lint

      - name: Cache Playwright browsers
        id: cache-pw
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        if: steps.cache-pw.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit)
        if: steps.cache-pw.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Build production bundle
        run: npm run build
        env:
          # Prod parity: civicpulse.es launched Periodistas IA (Vercel sets
          # this var), so e2e must test the same route set — incl. the
          # /cargos «Biografía →» link into the published agent report.
          VITE_ENABLE_PERIODISTAS: 'true'
          # Same parity, same reason. Without this the route is unmounted here,
          # `eficiencia.spec.ts` SKIPS itself — six specs and an axe pass — and
          # the page ships to production having been exercised by nothing in
          # CI. A suite that goes green by not running is the defect this repo
          # keeps paying for. tests/deploy-triggers.test.js compares the two
          # workflows so the pair cannot drift apart again.
          VITE_ENABLE_EFICIENCIA: 'true'

      - name: Run Playwright tests
        run: npm run test:e2e
        env:
          CI: '1'

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

name: e2e

on:
  push:
    branches: [main]
    paths-ignore:
      - 'public/data/**'
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'public/data/**'
      - '**/*.md'
  workflow_dispatch:

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Lint (fails on errors only; warnings allowed)
        run: npm run lint

      # Las tres puertas de publicación del pre-commit, sobre el árbol entero.
      # El gancho sólo existe donde alguien instaló husky a mano: `husky` no está
      # declarado en package.json (`"prepare": "husky || true"` falla en
      # silencio), así que en un clon nuevo y en las sesiones en la nube —de
      # donde sale la mayoría de los commits— no corría ninguna. Credenciales,
      # datos propios y borradores sobre personas vivas ya se han colado antes;
      # aquí la puerta no depende de la máquina de nadie. Cuatro segundos.
      - name: Publication scans (secrets · private data · editorial drafts)
        run: |
          npm run --silent check:secrets
          npm run --silent check:privado
          npm run --silent check:editorial

      # «tsc --noEmit, must stay clean» decía CLAUDE.md — y no lo ejecutaba
      # NADIE: ni este workflow, ni el build (vite no tipa), ni ningún hook.
      # Cuatro errores de tipo llegaron a un PR con todas las suites verdes
      # (vitest despoja los tipos). La lección del barrido de agosto, otra vez:
      # comprueba siempre quién ejecuta lo que construyes.
      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Cache Playwright browsers
        id: cache-pw
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        if: steps.cache-pw.outputs.cache-hit != 'true'
        run: |
          # apt sale en error EN BLOQUE por una sola fuente rota, y la del
          # runner que sobra tumbó CI cuatro veces el 2026-09-09. Va aquí
          # dentro y no en un paso hermano para que no pueda separarse de la
          # instalación que protege ni perder su `if:`.
          bash scripts/ci-apt-fuentes-rotas.sh
          npx playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit)
        if: steps.cache-pw.outputs.cache-hit == 'true'
        run: |
          # apt sale en error EN BLOQUE por una sola fuente rota, y la del
          # runner que sobra tumbó CI cuatro veces el 2026-09-09. Va aquí
          # dentro y no en un paso hermano para que no pueda separarse de la
          # instalación que protege ni perder su `if:`.
          bash scripts/ci-apt-fuentes-rotas.sh
          npx playwright install-deps chromium

      # Las pruebas de UNIDAD, que hasta el 2026-09-14 no ejecutaba ningún PR.
      #
      # Este workflow hacía lint, typecheck, build y Playwright, y `npm test` sólo
      # lo corría la nocturna: en `main`, de madrugada y con `continue-on-error`.
      # Las pruebas de unidad guardaban un PR sólo si quien lo abría se acordaba
      # de pasarlas, y así llegó a `main` una prueba frágil de la portada que
      # encontró después el PR de otro subsistema (#23).
      #
      # DESPUÉS de instalar Chromium, porque `reader-review-resiliencia` levanta
      # un navegador de verdad y sin él falla con «Executable doesn't exist», que
      # no se parece a su causa. ANTES de la build, porque falla más barato que el
      # e2e. `tests/workflows-unidad-en-pr.test.js` fija el paso, su directorio y
      # su orden.
      - name: Unit tests (npm test)
        timeout-minutes: 10
        run: npm test

      - name: Build production bundle
        run: npm run build
        env:
          # Prod parity: civicpulse.es launched Periodistas IA (Vercel sets
          # this var), so e2e must test the same route set — incl. the
          # /cargos «Biografía →» link into the published agent report.
          VITE_ENABLE_PERIODISTAS: 'true'
          # Same parity, same reason. Without this the route is unmounted here,
          # `eficiencia.spec.ts` SKIPS itself — six specs and an axe pass — and
          # the page ships to production having been exercised by nothing in
          # CI. A suite that goes green by not running is the defect this repo
          # keeps paying for. tests/deploy-triggers.test.js compares the two
          # workflows so the pair cannot drift apart again.
          VITE_ENABLE_EFICIENCIA: 'true'

      - name: Run Playwright tests
        run: npm run test:e2e
        env:
          CI: '1'

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

name: e2e

on:
  push:
    branches: [main]
    paths-ignore:
      - 'public/data/**'
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'public/data/**'
      - '**/*.md'
  workflow_dispatch:

# Tres trabajos en paralelo y no uno en fila. Hasta el 2026-10-26 esto era un
# solo trabajo, `playwright`, con tope de 20 min, que lo hacía todo seguido:
# lo estático, la suite de unidad (377–493 s), la build y Playwright (500–555
# s). Las ejecuciones sanas tardaban 16–19,5 min, así que el margen era de
# segundos. Ese día un espejo de apt lento estiró la instalación de las
# dependencias de Chromium de ~20 s a 1.044 s, a la suite de unidad le quedaron
# 96 s y el trabajo se canceló a los 20 min con el código bien (ejecución
# 40305149332, #431). Subir el tope sólo habría escondido el siguiente tropiezo.
#
# Separados, el más largo dura ~10 min bajo un tope de 20, y apt tiene el suyo
# propio (`scripts/ci-apt-con-tope.sh`). Un fallo de infraestructura se relanza
# con «Re-run failed jobs» sin repetir los otros dos.
#
# `playwright` conserva su nombre. `main` no tiene protección de rama ni reglas
# que exijan un check por nombre (comprobado el 2026-10-26); si algún día las
# tiene, los checks de este workflow son estos tres.
jobs:
  estatico:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Lint (fails on errors only; warnings allowed)
        run: npm run lint

      # El formato también, y sobre el árbol entero, como el pre-commit. Sin este
      # paso, #110 subió Prettier de 3.8 a 3.9 con la CI en verde, y la 3.9
      # formatea distinto dieciséis ficheros que nadie tocó: el primer `npm ci`
      # en el Mac habría puesto en rojo el pre-commit de todos, también el de los
      # commits de datos de los agentes. Aquí, una subida así sale roja en su
      # propio PR y se reformatea en él.
      - name: Format (prettier --check)
        run: npm run format:check

      # Las cuatro puertas de publicación del pre-commit, sobre el árbol entero.
      # El gancho sólo existe donde alguien instaló husky a mano: `husky` no está
      # declarado en package.json (el `prepare` es `husky && … || true`, y sin
      # husky falla en silencio), así que en un clon nuevo y en las sesiones en
      # la nube —de donde sale la mayoría de los commits— no corría ninguna.
      # Credenciales, datos propios, borradores sobre personas vivas y nombres
      # en los metadatos de una fixture ya se han colado antes; aquí la puerta
      # no depende de la máquina de nadie. `check:metadatos` enmascara lo que
      # encuentra: este registro es público. Cuatro segundos.
      - name: Publication scans (secrets · private data · editorial drafts · file metadata)
        run: |
          npm run --silent check:secrets
          npm run --silent check:privado
          npm run --silent check:editorial
          npm run --silent check:metadatos

      # «tsc --noEmit, must stay clean» decía CLAUDE.md — y no lo ejecutaba
      # NADIE: ni este workflow, ni el build (vite no tipa), ni ningún hook.
      # Cuatro errores de tipo llegaron a un PR con todas las suites verdes
      # (vitest despoja los tipos). La lección del barrido de agosto, otra vez:
      # comprueba siempre quién ejecuta lo que construyes.
      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

  unidad:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      # Chromium también aquí, y no sólo en `playwright`: una prueba de unidad
      # levanta un navegador de verdad (ver el paso de la suite, abajo).
      - name: Cache Playwright browsers
        id: cache-pw
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Tope a apt: 5 min dentro del guion, que si lo agota lo dice con su
      # nombre —espejo lento, no el código; relanza el trabajo—, y 7 en el paso
      # de respaldo, por si apt no muere con la señal. Lo sano son ~20 s; el
      # 2026-10-26 fueron 1.044 y se comieron el trabajo entero. La cabecera de
      # `scripts/ci-apt-con-tope.sh` lo cuenta, y
      # `tests/ci-apt-con-tope.test.js` exige el tope en cada instalación.
      - name: Install Playwright Chromium
        if: steps.cache-pw.outputs.cache-hit != 'true'
        timeout-minutes: 7
        run: |
          # apt sale en error EN BLOQUE por una sola fuente rota, y la del
          # runner que sobra tumbó CI cuatro veces el 2026-09-09. Va aquí
          # dentro y no en un paso hermano para que no pueda separarse de la
          # instalación que protege ni perder su `if:`.
          bash scripts/ci-apt-fuentes-rotas.sh
          bash scripts/ci-apt-con-tope.sh npx playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit)
        if: steps.cache-pw.outputs.cache-hit == 'true'
        timeout-minutes: 7
        run: |
          # apt sale en error EN BLOQUE por una sola fuente rota, y la del
          # runner que sobra tumbó CI cuatro veces el 2026-09-09. Va aquí
          # dentro y no en un paso hermano para que no pueda separarse de la
          # instalación que protege ni perder su `if:`.
          bash scripts/ci-apt-fuentes-rotas.sh
          bash scripts/ci-apt-con-tope.sh npx playwright install-deps chromium

      # Las pruebas de UNIDAD, que hasta el 2026-09-14 no ejecutaba ningún PR.
      #
      # Este workflow hacía lint, typecheck, build y Playwright, y `npm test` sólo
      # lo corría la nocturna: en `main`, de madrugada y con `continue-on-error`.
      # Las pruebas de unidad guardaban un PR sólo si quien lo abría se acordaba
      # de pasarlas, y así llegó a `main` una prueba frágil de la portada que
      # encontró después el PR de otro subsistema (#23).
      #
      # DESPUÉS de instalar Chromium, porque `reader-review-resiliencia` levanta
      # un navegador de verdad y sin él falla con «Executable doesn't exist», que
      # no se parece a su causa. Desde el 2026-10-26 van en su propio trabajo, en
      # paralelo con la build y Playwright y no por delante de ellos.
      # `tests/workflows-unidad-en-pr.test.js` fija el paso, su directorio y su
      # orden dentro del trabajo.
      - name: Unit tests (npm test)
        timeout-minutes: 10
        run: npm test

  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: cache-pw
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # El mismo tope a apt que en `unidad`, por el mismo motivo.
      - name: Install Playwright Chromium
        if: steps.cache-pw.outputs.cache-hit != 'true'
        timeout-minutes: 7
        run: |
          # apt sale en error EN BLOQUE por una sola fuente rota, y la del
          # runner que sobra tumbó CI cuatro veces el 2026-09-09. Va aquí
          # dentro y no en un paso hermano para que no pueda separarse de la
          # instalación que protege ni perder su `if:`.
          bash scripts/ci-apt-fuentes-rotas.sh
          bash scripts/ci-apt-con-tope.sh npx playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit)
        if: steps.cache-pw.outputs.cache-hit == 'true'
        timeout-minutes: 7
        run: |
          # apt sale en error EN BLOQUE por una sola fuente rota, y la del
          # runner que sobra tumbó CI cuatro veces el 2026-09-09. Va aquí
          # dentro y no en un paso hermano para que no pueda separarse de la
          # instalación que protege ni perder su `if:`.
          bash scripts/ci-apt-fuentes-rotas.sh
          bash scripts/ci-apt-con-tope.sh npx playwright install-deps chromium

      - name: Build production bundle
        run: npm run build
        env:
          # Prod parity: civicpulse.es launched Periodistas IA (Vercel sets
          # this var), so e2e must test the same route set — incl. the
          # /cargos «Biografía →» link into the published agent report.
          VITE_ENABLE_PERIODISTAS: 'true'
          # Same parity, same reason. Without this the route is unmounted here,
          # `eficiencia.spec.ts` SKIPS itself — six specs and an axe pass — and
          # the page ships to production having been exercised by nothing in
          # CI. A suite that goes green by not running is the defect this repo
          # keeps paying for. tests/deploy-triggers.test.js compares the two
          # workflows so the pair cannot drift apart again.
          VITE_ENABLE_EFICIENCIA: 'true'

      - name: Run Playwright tests
        run: npm run test:e2e
        env:
          CI: '1'

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

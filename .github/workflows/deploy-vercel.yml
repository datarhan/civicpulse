name: Deploy to Vercel

# Triggers a production deploy on every push to main.
#
# Why this workflow exists: Vercel's built-in GitHub integration requires
# every account that pushes commits to be a member of the Vercel team that
# owns the project. That needs a Pro plan for team collaborators. This
# workflow sidesteps that by calling `vercel --prod` with the project
# owner's personal token — no team-membership check involved.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN       · personal token from vercel.com/account/tokens
#   VERCEL_ORG_ID      · see .vercel/project.json → orgId
#   VERCEL_PROJECT_ID  · see .vercel/project.json → projectId
#
# Manual trigger: Actions tab → "Deploy to Vercel" → Run workflow.

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Also fire when a bot workflow pushes a fresh data commit. GitHub
  # deliberately doesn't trigger downstream workflows for pushes made with
  # the default GITHUB_TOKEN (anti-loop protection), so without this hook
  # the bot's commits would never cause a Vercel deploy — and the deployed
  # site stays frozen on whatever the last human push was.
  #
  # EVERY workflow that pushes to main belongs in this list. It held only the
  # nightly scrape until 2026-08-12, which meant the four right-of-reply
  # ingesters and the quejas pull all committed to main and deployed nothing:
  # a group exercised its legal right to reply, the bot commented «✅ Réplica
  # publicada · visible en …», and it was not visible — not until the nightly
  # run happened to push again. The trap was already written down in the
  # comment above; it was just only fixed for one of six.
  #
  # tests/deploy-triggers.test.js re-derives this list from the workflow
  # directory and fails when a new pusher is missing, because a hand-kept list
  # of workflows is exactly the thing this repo has watched go stale twice.
  workflow_run:
    workflows:
      - 'Nightly real-data refresh'
      - 'Ingest eficiencia responses'
      - 'Ingest finding responses'
      - 'Ingest journalist-report responses'
      - 'Ingest pleno votes'
      - 'Ingest queja responses'
      - 'Pull quejas.json from bot'
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Skip the deploy when the commit message ends with the sentinel
    # "[no-deploy]" (on its own line at the end of the body) so doc-only or
    # test-only commits can opt out without triggering on messages that
    # merely *document* the sentinel. workflow_run events have no
    # head_commit field, so for those we deploy iff the upstream concluded
    # successfully.
    if: >
      (github.event_name != 'push' ||
        !endsWith(github.event.head_commit.message, '[no-deploy]'))
      &&
      (github.event_name != 'workflow_run' ||
        github.event.workflow_run.conclusion == 'success')
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          # Launch flag flipped 2026-07-29 (operator promoted the v2+v3
          # journalist reports and asked for them on civicpulse.es):
          # ships /laboratorio/agentes + /laboratorio/agentes/:id. The
          # /curator surface stays dev-only (separate isDev gate).
          VITE_ENABLE_PERIODISTAS: 'true'
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt bundle
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

name: Ingest journalist-report responses

on:
  issues:
    types: [labeled, edited]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to re-process
        required: true

permissions:
  contents: write
  issues: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'derecho-replica' && contains(github.event.issue.labels.*.name, 'periodista')) ||
      (github.event.action == 'edited' && contains(github.event.issue.labels.*.name, 'derecho-replica') && contains(github.event.issue.labels.*.name, 'periodista'))
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci --no-audit --no-fund

      - name: Extract fields from issue body
        id: parse
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
        run: |
          set -euo pipefail
          BODY=$(gh issue view "$ISSUE_NUMBER" --json body -q .body)

          field() {
            awk -v h="$1" 'BEGIN{cap=0} $0 == "### " h {cap=1; next} /^### /{cap=0} cap' <<< "$BODY" \
              | sed '/^$/d' | awk '{$1=$1;print}' | head -n 40
          }

          REPORT_ID=$(field 'ID del informe' | head -n1)
          FROM=$(field 'Quién responde' | head -n1)
          QUOTE=$(field 'Cita literal de la réplica (verbatim, ≥20 caracteres)' | tr '\n' ' ' | sed 's/  */ /g' | awk '{$1=$1;print}')
          SOURCE_URL=$(field 'URL de la fuente (opcional)' | head -n1)

          if [ -z "$REPORT_ID" ] || [ -z "$FROM" ] || [ -z "$QUOTE" ]; then
            echo "::error::Missing report-id / from / quote fields"
            gh issue comment "$ISSUE_NUMBER" --body ":warning: No se pudieron extraer los campos obligatorios (ID, quién responde, cita). Revisa la plantilla y vuelve a enviar."
            exit 1
          fi

          echo "report_id=$REPORT_ID" >> "$GITHUB_OUTPUT"
          echo "from=$FROM"           >> "$GITHUB_OUTPUT"
          {
            echo "quote<<EOFQUOTE"
            echo "$QUOTE"
            echo "EOFQUOTE"
          } >> "$GITHUB_OUTPUT"
          echo "source_url=$SOURCE_URL" >> "$GITHUB_OUTPUT"

      - name: Apply via journalist-reply CLI
        env:
          REPORT_ID: ${{ steps.parse.outputs.report_id }}
          FROM: ${{ steps.parse.outputs.from }}
          QUOTE: ${{ steps.parse.outputs.quote }}
          SOURCE_URL: ${{ steps.parse.outputs.source_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
        run: |
          set -euo pipefail
          if [ -n "$SOURCE_URL" ]; then
            npm run journalist-reply -- "$REPORT_ID" "$FROM" "$QUOTE" "$SOURCE_URL" || {
              gh issue comment "$ISSUE_NUMBER" --body ":x: El validador rechazó la réplica. Comprueba que la cita tenga ≥20 caracteres y el ID del informe sea correcto."
              exit 1
            }
          else
            npm run journalist-reply -- "$REPORT_ID" "$FROM" "$QUOTE" || {
              gh issue comment "$ISSUE_NUMBER" --body ":x: El validador rechazó la réplica. Comprueba que la cita tenga ≥20 caracteres y el ID del informe sea correcto."
              exit 1
            }
          fi

      - name: Commit + push if diff
        run: |
          set -euo pipefail
          if git diff --quiet public/data/journalist-reports.json public/data/journalist-reports/; then
            echo "No diff to commit."
            exit 0
          fi
          git config user.name  "civicpulse-bot"
          git config user.email "bot@civicpulse"
          git add public/data/journalist-reports.json public/data/journalist-reports/
          git commit -m "feat(journalist): ingest réplica from #${{ github.event.issue.number || inputs.issue_number }}"
          git push

      - name: Close the issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
          REPORT_ID: ${{ steps.parse.outputs.report_id }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body ":white_check_mark: Réplica publicada en el informe \`${REPORT_ID}\`. Visible en el detalle del informe en /laboratorio/agentes."
          gh issue close "$ISSUE_NUMBER" --reason completed

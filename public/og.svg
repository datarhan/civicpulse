<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img"
     aria-label="CivicPulse · Riba-roja de Túria — quién dirige tu ayuntamiento, qué hace y cuánto cuesta, con una fuente para cada cifra">
  <!--
    Brandbook v3 §12. La tarjeta que circula fuera del sitio es la pieza más
    vista del proyecto y era la única que ninguna regla gobernaba. Lo que había
    antes incumplía seis:

      · fondo en degradado de ink a azul marino; la regla es ink plano
      · un latido que no era el monograma —otra curva, sin punto vivo— en el
        hexadecimal del PP anterior al retono
      · titular en la serif que §03 retira, a 76/800, y con eslogan
      · dos acentos, ámbar y azul claro, que no pertenecían a la paleta
      · una etiqueta de fase de producto
      · un pie con el subdominio de despliegue, cuando index.html publica
        og:url = civicpulse.es. La tarjeta se contradecía con el propio sitio.

    Ninguno de esos valores se repite aquí: nombrarlos volvería a meter en el
    fichero justo lo que se acaba de sacar, y un barrido de paleta los leería
    como si siguieran pintando algo. El registro está en git.

    Dos decisiones que las reglas no resolvían solas:

    1. §01 dice «sobre ink el cuadro se mantiene en petróleo» y «el latido nunca
       cambia de color». Sobre un fondo oscuro las dos chocan: el petróleo claro
       da 2,45:1 contra el ink, y un latido blanco sobre el petróleo oscuro da
       2,47:1. Se conservan las dos quedándose con el cuadro en petróleo claro:
       el elemento que de verdad se lee es el latido, y blanco sobre ese cuadro
       está a 7,80:1. El texto sí usa el petróleo de tema oscuro (7,77:1), por
       el mismo motivo por el que el token civic cambia de valor en html.dark.
       (Sin el nombre entre guiones: un doble guion es ilegal dentro de un
       comentario XML y rompe el fichero entero. Ocurrió al escribir esto.)

    2. §12 pide que el titular sea «la cifra con su denominador». Esta tarjeta
       es la del SITIO, estática y versionada en git: nada la regenera. Una
       cifra cocida aquí envejecería en silencio, que es justo lo que prohíbe
       §00 («ninguna cifra sin su fecha de captura»). Así que no lleva cifra.
       Una tarjeta POR HALLAZGO —con pastilla de veredicto, cifra, permalink y
       fecha— es una pieza generada, no este fichero.
  -->
  <rect width="1200" height="630" fill="#0B0F19"/>

  <!-- Monograma canónico: el pulso, dentro del cuadro, con su punto vivo. -->
  <g transform="translate(80 74) scale(1.5)">
    <rect width="64" height="64" rx="14" fill="#0E5B62"/>
    <path d="M10 34 L20 34 L24 26 L32 44 L38 30 L42 34 L54 34"
          fill="none" stroke="#FFFFFF" stroke-width="3.5"
          stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="54" cy="34" r="2.6" fill="#FFFFFF"/>
  </g>

  <!-- «Civic» en ink, «Pulse» en petróleo. Nunca todo de un color. -->
  <text x="200" y="128" font-family="Outfit, system-ui, sans-serif" font-size="52" font-weight="700"
        letter-spacing="-1.2">
    <tspan fill="#F1F5F9">Civic</tspan><tspan fill="#4FB3BD">Pulse</tspan>
  </text>
  <text x="202" y="163" font-family="DM Mono, ui-monospace, monospace" font-size="17"
        fill="#9DA2AB" letter-spacing="2.4">RIBA-ROJA DE TÚRIA · INE 46214</text>

  <!--
    Titular: primero QUIÉN, después medir.

    Es el orden fijo de «Identidad y orden» de docs/DESCRIPCION.md, que el
    2026-09-08 puso el «quién» delante: el sitio ya empezaba por ahí —/cargos es
    la primera ruta tras la portada— y la descripción hablaba de dinero y de
    promesas sin mencionar a nadie. Un vecino que quiere saber si su
    ayuntamiento funciona empieza preguntando quién lo dirige.

    Esta tarjeta se quedó con el orden viejo cuando las tres etiquetas de texto
    de index.html pasaron al one-liner, y es la superficie MÁS vista: la que se
    abre en WhatsApp. Ahora dice lo que dice la fuente, y en su orden.

    Cambia también la promesa: era «una cita por cada afirmación» y el one-liner
    dice «una fuente para cada cifra». Sin eslogan, sin serif y sin cifra que
    caduque, como antes. Medido con las fuentes de marca cargadas: 792 y 678 px
    de ancho sobre una banda útil de 1040, así que la caja no se toca.
  -->
  <text x="80" y="316" font-family="Outfit, system-ui, sans-serif" font-size="62" font-weight="700"
        fill="#F1F5F9" letter-spacing="-1.8">Quién dirige tu ayuntamiento,</text>
  <text x="80" y="392" font-family="Outfit, system-ui, sans-serif" font-size="62" font-weight="700"
        letter-spacing="-1.8"><tspan fill="#F1F5F9">qué hace y </tspan><tspan fill="#4FB3BD">cuánto cuesta</tspan><tspan fill="#F1F5F9">.</tspan></text>

  <text x="80" y="450" font-family="Outfit, system-ui, sans-serif" font-size="25" fill="#9DA2AB">
    Una fuente para cada cifra: presupuesto, contratos, plenos, promesas y quejas.
  </text>

  <!-- Filete de petróleo: el mismo recurso con el que §03b marca la cita. -->
  <rect x="80" y="502" width="4" height="60" fill="#4FB3BD"/>

  <!-- Los obligatorios del kit de prensa: permalink, metodología, réplica, licencia. -->
  <text x="104" y="526" font-family="DM Mono, ui-monospace, monospace" font-size="19"
        fill="#F1F5F9" letter-spacing="1.2">civicpulse.es</text>
  <text x="104" y="556" font-family="DM Mono, ui-monospace, monospace" font-size="15"
        fill="#9DA2AB" letter-spacing="1">metodología publicada · derecho de réplica abierto</text>
  <text x="1120" y="556" text-anchor="end" font-family="DM Mono, ui-monospace, monospace" font-size="15"
        fill="#9DA2AB" letter-spacing="1">AGPL-3.0-only</text>
</svg>
